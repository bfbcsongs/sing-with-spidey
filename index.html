<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CapCut Style Karaoke Editor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background-color: #0d1117; color: #f0f6fc; }
    .custom-scrollbar::-webkit-scrollbar { height: 6px; width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #38bdf8; border-radius: 4px; }

    /* TIMELINE TRACKS */
    .timeline-ruler {
      height: 24px;
      background: #161b22;
      border-bottom: 1px solid #30363d;
      position: relative;
    }
    
    .timeline-block {
      position: absolute;
      height: 36px;
      background: linear-gradient(90deg, #1e3a8a, #0284c7);
      border: 1px solid #38bdf8;
      border-radius: 6px;
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      padding: 0 8px;
      user-select: none;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      white-space: nowrap;
      overflow: hidden;
    }

    .timeline-block.selected {
      border: 2px solid #f43f5e;
      box-shadow: 0 0 10px rgba(244, 63, 94, 0.6);
    }

    /* DRAG HANDLES (CAPCUT STYLE) */
    .drag-handle {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 10px;
      background: #ffffff;
      cursor: ew-resize;
      opacity: 0.8;
    }
    .drag-handle-left { left: 0; border-radius: 4px 0 0 4px; }
    .drag-handle-right { right: 0; border-radius: 0 4px 4px 0; }

    /* KARAOKE PREVIEW GLOW */
    .lyric-preview {
      font-size: 2rem;
      font-weight: 900;
      color: #475569;
      transition: all 0.2s ease;
    }
    .lyric-preview.active {
      color: #38bdf8;
      transform: scale(1.1);
      text-shadow: 0 0 20px rgba(56, 189, 248, 0.8);
    }
  </style>
</head>
<body class="h-screen flex flex-col overflow-hidden select-none">
  <!-- TOP HEADER -->
  <header class="bg-slate-900 border-b border-slate-800 px-4 py-2 flex items-center justify-between shrink-0">
    <div class="flex items-center gap-2">
      <div class="w-7 h-7 bg-sky-500 rounded-lg flex items-center justify-center text-slate-950 font-black">
        <i class="fa-solid fa-scissors text-xs"></i>
      </div>
      <h1 class="text-xs font-bold uppercase tracking-wider text-sky-400">CapCut Lyric Editor</h1>
    </div>

    <div class="flex items-center gap-2">
      <label class="px-3 py-1 bg-slate-800 hover:bg-slate-700 text-sky-400 border border-sky-500/30 rounded-lg text-xs font-bold cursor-pointer">
        <i class="fa-solid fa-music"></i> Load MP3
        <input type="file" id="audio-input" accept="audio/*" class="hidden" onchange="loadAudio(event)">
      </label>
      <button onclick="addLyricBlock()" class="px-3 py-1 bg-sky-600 hover:bg-sky-500 text-white rounded-lg text-xs font-bold">
        + Add Block
      </button>
    </div>
  </header>

  <!-- VIDEO / KARAOKE DISPLAY CANVAS -->
  <div class="flex-1 bg-slate-950 flex flex-col items-center justify-center p-6 relative">
    <div id="preview-text" class="lyric-preview text-center max-w-xl">
      [I-paste/I-add ang Lyrics sa ibaba]
    </div>

    <div class="absolute top-4 left-4 text-xs font-mono text-slate-500">
      Time: <span id="time-display" class="text-sky-400 font-bold">00:00.00</span>
    </div>
  </div>

  <!-- PLAYBACK CONTROLS -->
  <div class="bg-slate-900 border-t border-slate-800 p-2 flex items-center justify-between px-4">
    <button id="btn-play" onclick="togglePlay()" class="w-8 h-8 bg-sky-500 text-slate-950 rounded-full flex items-center justify-center font-bold text-xs">
      <i class="fa-solid fa-play" id="play-icon"></i>
    </button>
    <div class="flex-1 mx-4">
      <input type="range" id="audio-seekbar" value="0" min="0" max="100" class="w-full accent-sky-400 h-1.5 bg-slate-800 rounded-lg cursor-pointer" oninput="seekAudio(event)">
    </div>
    <span id="duration-display" class="text-xs font-mono text-slate-400">00:00</span>
  </div>

  <!-- CAPCUT TIMELINE TRACK EDITOR -->
  <div class="h-64 bg-slate-900 border-t border-slate-800 flex flex-col shrink-0">
    <div class="px-3 py-1 bg-slate-950 border-b border-slate-800 flex justify-between items-center text-[11px] text-slate-400">
      <span><i class="fa-solid fa-layer-group"></i> TIMELINE TRACKS (Drag edges to adjust duration)</span>
      <span>Scale: <input type="range" min="10" max="100" value="30" id="zoom-scale" oninput="renderTimeline()" class="accent-sky-400 w-20"></span>
    </div>

    <!-- DRAGGABLE TIMELINE CONTAINER -->
    <div id="timeline-container" class="flex-1 overflow-x-auto custom-scrollbar relative p-2 bg-slate-950">
      <!-- PLAYHEAD RED LINE -->
      <div id="playhead" class="absolute top-0 bottom-0 w-0.5 bg-rose-500 z-30 pointer-events-none"></div>

      <!-- TRACKS AREA -->
      <div id="timeline-tracks" class="relative min-w-[2000px] h-full"></div>
    </div>
  </div>

  <audio id="audio-player"></audio>
  <script>
    let tracksData = [
      { id: 1, text: "Ako'y nananabik", start: 1.0, end: 4.5 },
      { id: 2, text: "Sa 'yong pagbabalik", start: 5.0, end: 8.5 },
      { id: 3, text: "Lahat ng luha ay mapapawi", start: 9.0, end: 13.0 }
    ];

    let pps = 30; // Pixels per second zoom factor
    let selectedId = null;
    let isDragging = false;
    let dragMode = null; // 'move', 'left-resize', 'right-resize'
    let dragStartX = 0;
    let initialStart = 0;
    let initialEnd = 0;

    const audio = document.getElementById('audio-player');

    window.onload = () => {
      renderTimeline();
      setupAudioListeners();
    };

    function loadAudio(e) {
      const file = e.target.files[0];
      if (file) {
        audio.src = URL.createObjectURL(file);
        audio.load();
      }
    }

    function togglePlay() {
      if (!audio.src) return alert("Mag-load muna ng MP3!");
      if (audio.paused) {
        audio.play();
        document.getElementById('play-icon').className = "fa-solid fa-pause";
      } else {
        audio.pause();
        document.getElementById('play-icon').className = "fa-solid fa-play";
      }
    }

    function seekAudio(e) {
      if (!audio.duration) return;
      audio.currentTime = (e.target.value / 100) * audio.duration;
    }

    function setupAudioListeners() {
      audio.ontimeupdate = () => {
        if (!audio.duration) return;
        const cur = audio.currentTime;

        // Update seeker & time display
        document.getElementById('audio-seekbar').value = (cur / audio.duration) * 100;
        const m = Math.floor(cur / 60);
        const s = (cur % 60).toFixed(2);
        document.getElementById('time-display').innerText = `${m < 10 ? '0':''}${m}:${s < 10 ? '0':''}${s}`;

        // Move Playhead line
        const playhead = document.getElementById('playhead');
        playhead.style.left = `${cur * pps}px`;

        // Update Lyrics Display
        const activeBlock = tracksData.find(b => cur >= b.start && cur <= b.end);
        const preview = document.getElementById('preview-text');
        if (activeBlock) {
          preview.innerText = activeBlock.text;
          preview.className = "lyric-preview active";
        } else {
          preview.className = "lyric-preview";
        }
      };
    }

    function renderTimeline() {
      pps = parseInt(document.getElementById('zoom-scale').value);
      const container = document.getElementById('timeline-tracks');
      container.innerHTML = '';

      tracksData.forEach((item, index) => {
        const block = document.createElement('div');
        block.className = `timeline-block ${selectedId === item.id ? 'selected' : ''}`;
        block.style.left = `${item.start * pps}px`;
        block.style.width = `${(item.end - item.start) * pps}px`;
        block.style.top = `${index * 42}px`;

        block.innerHTML = `
          <div class="drag-handle drag-handle-left" onmousedown="initDrag(event, ${item.id}, 'left-resize')" ontouchstart="initDrag(event, ${item.id}, 'left-resize')"></div>
          <span class="truncate px-2 pointer-events-none">${item.text}</span>
          <div class="drag-handle drag-handle-right" onmousedown="initDrag(event, ${item.id}, 'right-resize')" ontouchstart="initDrag(event, ${item.id}, 'right-resize')"></div>
        `;

        // Drag Whole Block
        block.onmousedown = (e) => { if (!e.target.classList.contains('drag-handle')) initDrag(e, item.id, 'move'); };
        block.ontouchstart = (e) => { if (!e.target.classList.contains('drag-handle')) initDrag(e, item.id, 'move'); };

        container.appendChild(block);
      });
    }

    function initDrag(e, id, mode) {
      e.stopPropagation();
      selectedId = id;
      isDragging = true;
      dragMode = mode;
      
      const target = tracksData.find(t => t.id === id);
      initialStart = target.start;
      initialEnd = target.end;
      dragStartX = e.touches ? e.touches[0].clientX : e.clientX;

      document.onmousemove = doDrag;
      document.ontouchmove = doDrag;
      document.onmouseup = stopDrag;
      document.ontouchend = stopDrag;

      renderTimeline();
    }

    function doDrag(e) {
      if (!isDragging) return;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const deltaX = clientX - dragStartX;
      const deltaTime = deltaX / pps;

      const target = tracksData.find(t => t.id === selectedId);

      if (dragMode === 'move') {
        const duration = initialEnd - initialStart;
        target.start = Math.max(0, initialStart + deltaTime);
        target.end = target.start + duration;
      } else if (dragMode === 'left-resize') {
        target.start = Math.max(0, Math.min(initialEnd - 0.5, initialStart + deltaTime));
      } else if (dragMode === 'right-resize') {
        target.end = Math.max(target.start + 0.5, initialEnd + deltaTime);
      }

      renderTimeline();
    }

    function stopDrag() {
      isDragging = false;
      document.onmousemove = null;
      document.ontouchmove = null;
    }

    function addLyricBlock() {
      const text = prompt("I-enter ang Linya ng Lyrics:", "Bagong Lyrics Line");
      if (text) {
        const lastEnd = tracksData.length > 0 ? tracksData[tracksData.length - 1].end : 0;
        tracksData.push({
          id: Date.now(),
          text: text,
          start: lastEnd + 1,
          end: lastEnd + 5
        });
        renderTimeline();
      }
    }
  </script>
</body>
</html>
