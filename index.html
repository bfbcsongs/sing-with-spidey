<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Karaoke Keyframe Editor</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#0b1020;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

button,input,textarea{
  font:inherit;
}

button{
  border:0;
  color:white;
  background:#1f2937;
  border-radius:8px;
  padding:10px 13px;
  cursor:pointer;
}

button:active{
  transform:scale(.97);
}

.app{
  height:100vh;
  display:flex;
  flex-direction:column;
}

/* TOP BAR */

.topbar{
  height:58px;
  min-height:58px;
  display:flex;
  align-items:center;
  gap:7px;
  padding:7px;
  background:#111827;
  border-bottom:1px solid #374151;
  overflow-x:auto;
}

.logo{
  font-weight:bold;
  font-size:15px;
  margin-right:5px;
  white-space:nowrap;
}

.topbtn{
  white-space:nowrap;
  font-size:13px;
  background:#1f2937;
}

.topbtn.primary{
  background:#2563eb;
}

/* PREVIEW */

.preview{
  height:145px;
  min-height:145px;
  background:#050812;
  border-bottom:1px solid #374151;
  display:flex;
  flex-direction:column;
}

.preview-screen{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:12px;
  overflow:hidden;
}

.preview-text{
  position:relative;
  max-width:95%;
  text-align:center;
  font-weight:bold;
  font-size:30px;
  line-height:1.2;
  color:#fff;
  text-shadow:
    0 2px 4px #000,
    0 0 8px #000;
}

.preview-base{
  white-space:pre-wrap;
}

.preview-highlight{
  position:absolute;
  left:0;
  top:0;
  width:0%;
  height:100%;
  overflow:hidden;
  color:#ffe600;
  white-space:pre-wrap;
  pointer-events:none;
}

/* AUDIO BAR */

.audio-bar{
  height:55px;
  min-height:55px;
  display:flex;
  align-items:center;
  gap:8px;
  padding:7px;
  background:#111827;
  border-bottom:1px solid #374151;
}

.playbtn{
  width:42px;
  height:40px;
  padding:0;
  font-size:19px;
  background:#2563eb;
}

.time{
  width:100px;
  font-size:12px;
  color:#d1d5db;
  text-align:center;
}

.seek{
  flex:1;
}

.zoom-box{
  display:flex;
  gap:4px;
}

.zoom-box button{
  padding:7px 10px;
}

/* TOOLBAR */

.toolbar{
  height:48px;
  min-height:48px;
  display:flex;
  align-items:center;
  gap:6px;
  padding:5px 7px;
  background:#151b2b;
  border-bottom:1px solid #374151;
  overflow-x:auto;
}

.toolbar button{
  font-size:12px;
  white-space:nowrap;
}

/* EDITOR */

.editor{
  flex:1;
  min-height:0;
  position:relative;
  overflow:hidden;
}

.timeline-scroll{
  width:100%;
  height:100%;
  overflow:auto;
  position:relative;
  background:#080d18;
}

.timeline{
  position:relative;
  min-height:100%;
}

/* RULER */

.ruler{
  height:35px;
  position:relative;
  background:#111827;
  border-bottom:1px solid #374151;
  overflow:hidden;
}

.ruler-mark{
  position:absolute;
  top:0;
  height:100%;
  border-left:1px solid #4b5563;
  color:#9ca3af;
  font-size:10px;
  padding-left:3px;
  pointer-events:none;
}

.ruler-mark.small{
  border-left:1px solid #293244;
}

/* WAVEFORM */

.wave-wrap{
  height:80px;
  position:relative;
  background:#0c1424;
  border-bottom:1px solid #273244;
}

#waveform{
  position:absolute;
  left:0;
  top:0;
  height:100%;
}

/* TRACK */

.track{
  position:relative;
  min-height:360px;
  padding-top:10px;
}

.track-grid{
  position:absolute;
  inset:0;
  pointer-events:none;
}

.grid-line{
  position:absolute;
  top:0;
  bottom:0;
  border-left:1px solid rgba(148,163,184,.08);
}

/* LYRIC CLIP */

.lyric-clip{
  position:absolute;
  height:62px;
  border:1px solid #475569;
  background:#172033;
  border-radius:8px;
  overflow:visible;
  touch-action:none;
  user-select:none;
}

.lyric-clip.selected{
  border:2px solid #38bdf8;
  box-shadow:0 0 0 2px rgba(56,189,248,.12);
}

.clip-body{
  position:absolute;
  left:5px;
  right:5px;
  top:5px;
  bottom:5px;
  border-radius:5px;
  overflow:hidden;
  background:#202b3f;
}

.clip-base{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  padding:0 10px;
  color:#dbeafe;
  font-size:14px;
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
}

.clip-highlight{
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:0%;
  overflow:hidden;
  background:rgba(250,204,21,.22);
}

.clip-highlight-text{
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:100%;
  display:flex;
  align-items:center;
  padding:0 10px;
  color:#fde047;
  font-size:14px;
  font-weight:bold;
  white-space:nowrap;
}

.resize-handle{
  position:absolute;
  top:0;
  bottom:0;
  width:10px;
  z-index:10;
  cursor:ew-resize;
}

.resize-left{
  left:-5px;
}

.resize-right{
  right:-5px;
}

.clip-info{
  position:absolute;
  left:7px;
  bottom:-18px;
  font-size:9px;
  color:#64748b;
  white-space:nowrap;
  pointer-events:none;
}

/* KEYFRAMES */

.keyframe{
  position:absolute;
  top:-10px;
  width:20px;
  height:20px;
  margin-left:-10px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#facc15;
  font-size:17px;
  line-height:20px;
  z-index:20;
  cursor:pointer;
  text-shadow:0 1px 2px #000;
}

.keyframe.selected{
  color:#38bdf8;
  transform:scale(1.25);
}

/* PLAYHEAD */

.playhead{
  position:absolute;
  top:0;
  width:2px;
  background:#ef4444;
  z-index:100;
  pointer-events:none;
}

.playhead-head{
  position:absolute;
  top:0;
  left:-7px;
  width:16px;
  height:16px;
  background:#ef4444;
  clip-path:polygon(50% 100%,0 0,100% 0);
}

/* KEY PANEL */

.key-panel{
  height:92px;
  min-height:92px;
  background:#111827;
  border-top:1px solid #374151;
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px;
}

.key-actions{
  display:flex;
  gap:7px;
}

.key-btn{
  width:48px;
  height:48px;
  padding:0;
  font-size:24px;
  font-weight:bold;
}

.add-key{
  background:#16a34a;
}

.remove-key{
  background:#dc2626;
}

.key-info{
  min-width:120px;
  font-size:11px;
  color:#cbd5e1;
}

.key-info b{
  color:#fff;
}

.progress-box{
  flex:1;
  min-width:100px;
}

.progress-label{
  display:flex;
  justify-content:space-between;
  font-size:11px;
  color:#cbd5e1;
  margin-bottom:4px;
}

.progress-slider{
  width:100%;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  z-index:1000;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.72);
  padding:15px;
}

.modal.show{
  display:flex;
}

.modal-card{
  width:min(700px,100%);
  max-height:90vh;
  display:flex;
  flex-direction:column;
  background:#111827;
  border:1px solid #374151;
  border-radius:12px;
  overflow:hidden;
}

.modal-header{
  padding:13px;
  font-weight:bold;
  border-bottom:1px solid #374151;
}

.modal-body{
  padding:12px;
  overflow:auto;
}

#lyricsInput{
  width:100%;
  min-height:320px;
  resize:none;
  padding:12px;
  color:#fff;
  background:#080d18;
  border:1px solid #475569;
  border-radius:8px;
  outline:none;
}

.modal-footer{
  display:flex;
  justify-content:flex-end;
  gap:7px;
  padding:10px;
  border-top:1px solid #374151;
}

.modal-footer button{
  min-width:90px;
}

/* EMPTY */

.empty{
  position:absolute;
  left:50%;
  top:180px;
  transform:translateX(-50%);
  color:#64748b;
  text-align:center;
  width:300px;
  pointer-events:none;
}

/* MOBILE */

@media(max-width:600px){

  .logo{
    font-size:13px;
  }

  .topbar{
    height:54px;
    min-height:54px;
  }

  .preview{
    height:125px;
    min-height:125px;
  }

  .preview-text{
    font-size:23px;
  }

  .audio-bar{
    height:52px;
    min-height:52px;
  }

  .time{
    width:80px;
  }

  .toolbar{
    height:46px;
    min-height:46px;
  }

  .key-panel{
    height:88px;
    min-height:88px;
  }

  .key-info{
    min-width:95px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- TOP BAR -->

  <div class="topbar">

    <div class="logo">
      🎤 KARAOKE FX
    </div>

    <button class="topbtn primary" id="audioBtn">
      🎵 MP3
    </button>

    <button class="topbtn" id="lyricsBtn">
      📝 Lyrics
    </button>

    <button class="topbtn" id="saveBtn">
      💾 Save
    </button>

    <button class="topbtn" id="loadBtn">
      📂 Load
    </button>

    <button class="topbtn" id="exportBtn">
      ⬇ Export
    </button>

    <button class="topbtn" id="importBtn">
      ⬆ Import
    </button>

    <input
      type="file"
      id="audioInput"
      accept="audio/*,.mp3,.wav,.m4a,.ogg"
      hidden
    >

    <input
      type="file"
      id="projectInput"
      accept=".json,application/json"
      hidden
    >

  </div>


  <!-- PREVIEW -->

  <div class="preview">

    <div class="preview-screen">

      <div class="preview-text">

        <div
          class="preview-base"
          id="previewBase"
        ></div>

        <div
          class="preview-highlight"
          id="previewHighlight"
        ></div>

      </div>

    </div>

  </div>


  <!-- AUDIO BAR -->

  <div class="audio-bar">

    <button
      class="playbtn"
      id="playBtn"
    >
      ▶
    </button>

    <div
      class="time"
      id="timeLabel"
    >
      00:00 / 00:00
    </div>

    <input
      class="seek"
      id="seek"
      type="range"
      min="0"
      max="0"
      step="0.01"
      value="0"
    >

    <div class="zoom-box">

      <button id="zoomOut">
        −
      </button>

      <button id="zoomIn">
        +
      </button>

    </div>

  </div>


  <!-- TOOLBAR -->

  <div class="toolbar">

    <button id="splitBtn">
      ✂ Split
    </button>

    <button id="duplicateBtn">
      Duplicate
    </button>

    <button id="deleteLineBtn">
      Delete Line
    </button>

    <button id="autoKeysBtn">
      0→100
    </button>

    <button id="resetKeysBtn">
      Reset Keys
    </button>

  </div>


  <!-- TIMELINE -->

  <div class="editor">

    <div
      class="timeline-scroll"
      id="timelineScroll"
    >

      <div
        class="timeline"
        id="timeline"
      >

        <div
          class="ruler"
          id="ruler"
        ></div>

        <div
          class="wave-wrap"
          id="waveWrap"
        >

          <canvas
            id="waveform"
          ></canvas>

        </div>

        <div
          class="track"
          id="track"
        >

          <div
            class="track-grid"
            id="trackGrid"
          ></div>

          <div
            class="empty"
            id="emptyMessage"
          >
            Load an MP3 and add lyrics
          </div>

        </div>

        <div
          class="playhead"
          id="playhead"
        >

          <div class="playhead-head"></div>

        </div>

      </div>

    </div>

  </div>


  <!-- KEYFRAME PANEL -->

  <div class="key-panel">

    <div class="key-actions">

      <button
        class="key-btn remove-key"
        id="minusKey"
      >
        −
      </button>

      <button
        class="key-btn add-key"
        id="plusKey"
      >
        +
      </button>

    </div>

    <div
      class="key-info"
      id="keyInfo"
    >
      No keyframe selected
    </div>

    <div class="progress-box">

      <div class="progress-label">

        <span>
          Shading
        </span>

        <b id="progressValue">
          0%
        </b>

      </div>

      <input
        class="progress-slider"
        id="progressSlider"
        type="range"
        min="0"
        max="100"
        value="0"
      >

    </div>

  </div>

</div>


<!-- LYRICS MODAL -->

<div
  class="modal"
  id="lyricsModal"
>

  <div class="modal-card">

    <div class="modal-header">
      📝 Paste Lyrics
    </div>

    <div class="modal-body">

      <textarea
        id="lyricsInput"
        placeholder="Paste your lyrics here.

One line per row.

Example:

Amazing grace how sweet the sound
That saved a wretch like me
I once was lost but now am found
Was blind but now I see"
      ></textarea>

    </div>

    <div class="modal-footer">

      <button id="cancelLyrics">
        Cancel
      </button>

      <button
        id="applyLyrics"
        style="background:#2563eb"
      >
        Apply Lyrics
      </button>

    </div>

  </div>

</div>


<audio
  id="audio"
  preload="metadata"
></audio>


<script>

/* =========================================================
   KARAOKE FX EDITOR
   PART 1
   ========================================================= */

const audio =
  document.getElementById("audio");

const audioInput =
  document.getElementById("audioInput");

const projectInput =
  document.getElementById("projectInput");

const audioBtn =
  document.getElementById("audioBtn");

const lyricsBtn =
  document.getElementById("lyricsBtn");

const lyricsModal =
  document.getElementById("lyricsModal");

const lyricsInput =
  document.getElementById("lyricsInput");

const applyLyrics =
  document.getElementById("applyLyrics");

const cancelLyrics =
  document.getElementById("cancelLyrics");

const playBtn =
  document.getElementById("playBtn");

const seek =
  document.getElementById("seek");

const timeLabel =
  document.getElementById("timeLabel");

const timelineScroll =
  document.getElementById("timelineScroll");

const timeline =
  document.getElementById("timeline");

const ruler =
  document.getElementById("ruler");

const track =
  document.getElementById("track");

const trackGrid =
  document.getElementById("trackGrid");

const waveWrap =
  document.getElementById("waveWrap");

const waveform =
  document.getElementById("waveform");

const playhead =
  document.getElementById("playhead");

const emptyMessage =
  document.getElementById("emptyMessage");

const previewBase =
  document.getElementById("previewBase");

const previewHighlight =
  document.getElementById("previewHighlight");

const plusKey =
  document.getElementById("plusKey");

const minusKey =
  document.getElementById("minusKey");

const keyInfo =
  document.getElementById("keyInfo");

const progressSlider =
  document.getElementById("progressSlider");

const progressValue =
  document.getElementById("progressValue");

const zoomIn =
  document.getElementById("zoomIn");

const zoomOut =
  document.getElementById("zoomOut");

const splitBtn =
  document.getElementById("splitBtn");

const duplicateBtn =
  document.getElementById("duplicateBtn");

const deleteLineBtn =
  document.getElementById("deleteLineBtn");

const autoKeysBtn =
  document.getElementById("autoKeysBtn");

const resetKeysBtn =
  document.getElementById("resetKeysBtn");

const saveBtn =
  document.getElementById("saveBtn");

const loadBtn =
  document.getElementById("loadBtn");

const exportBtn =
  document.getElementById("exportBtn");

const importBtn =
  document.getElementById("importBtn");


/* =========================================================
   STATE
   ========================================================= */

let state = {

  audioName: "",

  audioDuration: 0,

  zoom: 80,

  lines: [],

  selectedLineId: null,

  selectedKeyId: null,

  currentTime: 0

};


let audioURL = null;

let audioBuffer = null;

let audioContext = null;


/* =========================================================
   HELPERS
   ========================================================= */

function uid(){

  return Math.random()
    .toString(36)
    .slice(2) +
    Date.now().toString(36);

}


function clamp(value,min,max){

  return Math.max(
    min,
    Math.min(max,value)
  );

}


function formatTime(seconds){

  if(!isFinite(seconds)){
    return "00:00";
  }

  seconds = Math.max(0,seconds);

  const m =
    Math.floor(seconds / 60)
      .toString()
      .padStart(2,"0");

  const s =
    Math.floor(seconds % 60)
      .toString()
      .padStart(2,"0");

  return m + ":" + s;

}


function formatLongTime(seconds){

  if(!isFinite(seconds)){
    return "0.00";
  }

  return Number(seconds)
    .toFixed(2);

}


function getDuration(){

  return Number(
    state.audioDuration || 0
  );

}


function timeToX(time){

  return time * state.zoom;

}


function xToTime(x){

  return x / state.zoom;

}


function getSelectedLine(){

  return state.lines.find(
    line =>
      line.id === state.selectedLineId
  ) || null;

}


function getSelectedKey(){

  const line =
    getSelectedLine();

  if(!line){
    return null;
  }

  return line.keyframes.find(
    key =>
      key.id === state.selectedKeyId
  ) || null;

}


/* =========================================================
   AUDIO FILE
   ========================================================= */

audioBtn.addEventListener(
  "click",
  () => {

    audioInput.click();

  }
);


audioInput.addEventListener(
  "change",
  async event => {

    const file =
      event.target.files[0];

    if(!file){
      return;
    }

    if(audioURL){
      URL.revokeObjectURL(audioURL);
    }

    audioURL =
      URL.createObjectURL(file);

    audio.src =
      audioURL;

    audio.load();

    state.audioName =
      file.name;

    state.audioDuration = 0;

    state.currentTime = 0;

    audio.onloadedmetadata =
      async () => {

        state.audioDuration =
          audio.duration || 0;

        seek.max =
          state.audioDuration;

        seek.value = 0;

        timeLabel.textContent =
          "00:00 / " +
          formatTime(
            state.audioDuration
          );

        if(
          state.lines.length === 0
        ){

          emptyMessage.style.display =
            "block";

        }

        renderAll();

        await decodeAudio(file);

      };

  }
);


/* =========================================================
   DECODE WAVEFORM
   ========================================================= */

async function decodeAudio(file){

  try{

    if(!audioContext){

      audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }

    const arrayBuffer =
      await file.arrayBuffer();

    audioBuffer =
      await audioContext.decodeAudioData(
        arrayBuffer
      );

    drawWaveform();

  }catch(error){

    console.log(
      "Waveform error:",
      error
    );

  }

}


/* =========================================================
   PLAY / PAUSE
   ========================================================= */

playBtn.addEventListener(
  "click",
  () => {

    if(!audio.src){

      audioBtn.click();

      return;

    }

    if(audio.paused){

      audio.play();

    }else{

      audio.pause();

    }

  }
);


audio.addEventListener(
  "play",
  () => {

    playBtn.textContent =
      "⏸";

  }
);


audio.addEventListener(
  "pause",
  () => {

    playBtn.textContent =
      "▶";

  }
);


audio.addEventListener(
  "ended",
  () => {

    playBtn.textContent =
      "▶";

  }
);


/* =========================================================
   AUDIO TIME
   ========================================================= */

audio.addEventListener(
  "timeupdate",
  () => {

    state.currentTime =
      audio.currentTime;

    seek.value =
      audio.currentTime;

    timeLabel.textContent =
      formatTime(
        audio.currentTime
      ) +
      " / " +
      formatTime(
        getDuration()
      );

    updatePlayhead();

    updatePreview();

    updateClipHighlights();

    updateKeyPanel();

  }
);


seek.addEventListener(
  "input",
  () => {

    const t =
      Number(seek.value);

    audio.currentTime =
      t;

    state.currentTime =
      t;

    updatePlayhead();

    updatePreview();

  }
);


/* =========================================================
   LYRICS MODAL
   ========================================================= */

lyricsBtn.addEventListener(
  "click",
  () => {

    lyricsModal.classList.add(
      "show"
    );

    lyricsInput.focus();

  }
);


cancelLyrics.addEventListener(
  "click",
  () => {

    lyricsModal.classList.remove(
      "show"
    );

  }
);


lyricsModal.addEventListener(
  "click",
  event => {

    if(
      event.target ===
      lyricsModal
    ){

      lyricsModal.classList.remove(
        "show"
      );

    }

  }
);


/* =========================================================
   CREATE LYRICS
   ========================================================= */

applyLyrics.addEventListener(
  "click",
  () => {

    const text =
      lyricsInput.value.trim();

    if(!text){

      alert(
        "Please paste your lyrics first."
      );

      return;

    }

    const lines =
      text
        .split(/\r?\n/)
        .map(
          line => line.trim()
        )
        .filter(Boolean);

    if(!lines.length){
      return;
    }

    const duration =
      getDuration();

    if(duration <= 0){

      alert(
        "Please load the MP3 first."
      );

      return;

    }

    state.lines = [];

    const gap =
      duration / lines.length;

    lines.forEach(
      (text,index) => {

        const start =
          index * gap;

        const end =
          index === lines.length - 1
            ? duration
            : (index + 1) * gap;

        state.lines.push({

          id: uid(),

          text,

          start,

          end,

          keyframes: [

            {
              id: uid(),
              time: start,
              progress: 0
            },

            {
              id: uid(),
              time: end,
              progress: 100
            }

          ]

        });

      }
    );

    state.selectedLineId =
      state.lines[0].id;

    state.selectedKeyId =
      state.lines[0]
        .keyframes[0].id;

    lyricsModal.classList.remove(
      "show"
    );

    renderAll();

  }
);


/* =========================================================
   RENDER EVERYTHING
   ========================================================= */

function renderAll(){

  updateTimelineWidth();

  renderRuler();

  renderGrid();

  renderLyrics();

  updatePlayhead();

  updatePreview();

  updateKeyPanel();

  drawWaveform();

}


/* =========================================================
   TIMELINE WIDTH
   ========================================================= */

function updateTimelineWidth(){

  const duration =
    Math.max(
      getDuration(),
      30
    );

  const width =
    Math.max(
      duration * state.zoom,
      timelineScroll.clientWidth
    );

  timeline.style.width =
    width + "px";

}


/* =========================================================
   RULER
   ========================================================= */

function renderRuler(){

  ruler.innerHTML = "";

  const duration =
    Math.max(
      getDuration(),
      30
    );

  const step =
    state.zoom >= 100
      ? 1
      : state.zoom >= 60
        ? 2
        : 5;

  for(
    let t = 0;
    t <= duration;
    t += step
  ){

    const mark =
      document.createElement(
        "div"
      );

    mark.className =
      "ruler-mark";

    mark.style.left =
      timeToX(t) + "px";

    mark.textContent =
      formatTime(t);

    ruler.appendChild(mark);

  }

}


/* =========================================================
   GRID
   ========================================================= */

function renderGrid(){

  trackGrid.innerHTML = "";

  const duration =
    Math.max(
      getDuration(),
      30
    );

  const step =
    state.zoom >= 100
      ? 1
      : state.zoom >= 60
        ? 2
        : 5;

  for(
    let t = 0;
    t <= duration;
    t += step
  ){

    const line =
      document.createElement(
        "div"
      );

    line.className =
      "grid-line";

    line.style.left =
      timeToX(t) + "px";

    trackGrid.appendChild(line);

  }

}


/* =========================================================
   RENDER LYRIC CLIPS
   ========================================================= */

function renderLyrics(){

  const oldClips =
    track.querySelectorAll(
      ".lyric-clip"
    );

  oldClips.forEach(
    clip => clip.remove()
  );

  if(state.lines.length){

    emptyMessage.style.display =
      "none";

  }else{

    emptyMessage.style.display =
      "block";

  }

  state.lines.forEach(
    (line,index) => {

      const clip =
        document.createElement(
          "div"
        );

      clip.className =
        "lyric-clip";

      if(
        line.id ===
        state.selectedLineId
      ){

        clip.classList.add(
          "selected"
        );

      }

      clip.dataset.id =
        line.id;

      clip.style.left =
        timeToX(line.start) +
        "px";

      clip.style.width =
        Math.max(
          40,
          timeToX(
            line.end -
            line.start
          )
        ) +
        "px";

      clip.style.top =
        (index * 82 + 10) +
        "px";


      /* BODY */

      const body =
        document.createElement(
          "div"
        );

      body.className =
        "clip-body";


      /* BASE TEXT */

      const base =
        document.createElement(
          "div"
        );

      base.className =
        "clip-base";

      base.textContent =
        line.text;


      /* HIGHLIGHT */

      const highlight =
        document.createElement(
          "div"
        );

      highlight.className =
        "clip-highlight";


      const highlightText =
        document.createElement(
          "div"
        );

      highlightText.className =
        "clip-highlight-text";

      highlightText.textContent =
        line.text;


      highlight.appendChild(
        highlightText
      );


      body.appendChild(base);

      body.appendChild(
        highlight
      );

      clip.appendChild(
        body
      );


      /* LEFT RESIZE */

      const leftHandle =
        document.createElement(
          "div"
        );

      leftHandle.className =
        "resize-handle resize-left";

      clip.appendChild(
        leftHandle
      );


      /* RIGHT RESIZE */

      const rightHandle =
        document.createElement(
          "div"
        );

      rightHandle.className =
        "resize-handle resize-right";

      clip.appendChild(
        rightHandle
      );


      /* INFO */

      const info =
        document.createElement(
          "div"
        );

      info.className =
        "clip-info";

      info.textContent =
        formatLongTime(
          line.start
        ) +
        " → " +
        formatLongTime(
          line.end
        );

      clip.appendChild(info);


      /* KEYFRAMES */

      line.keyframes
        .sort(
          (a,b) =>
            a.time - b.time
        )
        .forEach(
          key => {

            const diamond =
              document.createElement(
                "div"

              key.id ===

            }

            const relative =
              key.time -
              line.start;

            const duration =
              line.end -
              line.start;

            const percent =
              duration > 0
                ? (
                    relative /
                    duration
                  ) * 100
                : 0;

            diamond.style.left =
              percent + "%";


            diamond.addEventListener(
              "pointerdown",
              event => {

                event.stopPropagation();

                  line.id;

                  key.id;

                  key.time;

                if(audio.src){

                  audio.currentTime =
                    key.time;

                }

                renderLyrics();

                updatePreview();

                updateKeyPanel();

              }
            );


            clip.appendChild(
              diamond
            );

          }
        );

      clip.addEventListener(
        "pointerdown",
        event => {

          if(
            event.target.classList.contains(
              "resize-left"
            ) ||
            event.target.classList.contains(
              "resize-right"
            ) ||
            event.target.classList.contains(
              "keyframe"

          ){

          }

          state.selectedLineId =
            line.id;

          state.selectedKeyId =
            null;

          beginMoveClip(
            event,
            line,

          );

        }
      );


      /* RESIZE LEFT */

      leftHandle.addEventListener(
        "pointerdown",
        event => {

          event.stopPropagation();

            event,

        }
      );


      /* RESIZE RIGHT */

      rightHandle.addEventListener(
        "pointerdown",
        event => {

          event.stopPropagation();

          beginResize(
            event,
            line,
            "right"
          );

        }
      );


      track.appendChild(
        clip
      );

    }
  );

  updateClipHighlights();

}


/* =========================================================
   MOVE LYRIC CLIP
   ========================================================= */

function beginMoveClip(
  event,
  line,
  clip
){

  const startX =
    event.clientX;

  const originalStart =
    line.start;

  const originalEnd =
    line.end;

  const duration =
    originalEnd -
    originalStart;

  const oldKeys =
    line.keyframes.map(
      key => ({
        id:key.id,
        time:key.time
      })
    );

  clip.setPointerCapture(
    event.pointerId
  );


  function move(e){

    const dx =
      e.clientX -
      startX;

    const dt =
      dx / state.zoom;

    let newStart =
      originalStart + dt;

    let newEnd =
      originalEnd + dt;

    if(newStart < 0){

      newEnd -= newStart;

      newStart = 0;

    }

    const total =
      getDuration();

    if(
      total > 0 &&
      newEnd > total
    ){

      const excess =
        newEnd - total;

      newStart -= excess;

      newEnd =
        total;

      if(newStart < 0){
        newStart = 0;
      }

    }

    line.start =
      newStart;

    line.end =
      newEnd;


    line.keyframes.forEach(
      key => {

        const old =
          oldKeys.find(
            k => k.id === key.id
          );

        if(old){

          key.time =
            old.time +
            (
              newStart -
              originalStart
            );

        }

      }
    );


    clip.style.left =
      timeToX(
        newStart
      ) + "px";

    clip.style.width =
      timeToX(
        duration
      ) + "px";

  }


  function finish(){

    clip.removeEventListener(
      "pointermove",
      move
    );

    clip.removeEventListener(
      "pointerup",
      finish
    );

    clip.removeEventListener(
      "pointercancel",
      finish
    );

    renderAll();

  }


  clip.addEventListener(
    "pointermove",
    move
  );

  clip.addEventListener(
    "pointerup",
    finish
  );

  clip.addEventListener(
    "pointercancel",
    finish
  );

  renderAll();

}


/* =========================================================
   RESIZE LYRIC
   ========================================================= */

function beginResize(
  event,
  line,
  side
){

  const startX =
    event.clientX;

  const originalStart =
    line.start;

  const originalEnd =
    line.end;

  const originalKeys =
    line.keyframes.map(
      key => ({
        id:key.id,
        time:key.time
      })
    );

  const clip =
    event.currentTarget
      .parentElement;

  clip.setPointerCapture(
    event.pointerId
  );


  function move(e){

    const dx =
      e.clientX -
      startX;

    const dt =
      dx / state.zoom;

    if(side === "left"){

      const newStart =
        clamp(
          originalStart + dt,
          0,
          originalEnd - 0.2
        );

      line.start =
        newStart;

      line.keyframes
        .forEach(
          key => {

            const old =
              originalKeys.find(
                k =>
                  k.id === key.id
              );

            if(old){

              key.time =
                clamp(
                  old.time,
                  line.start,
                  line.end
                );

            }

          }
        );

    }else{

      const newEnd =
        clamp(
          originalEnd + dt,
          originalStart + 0.2,
          getDuration()
        );

      line.end =
        newEnd;

      line.keyframes
        .forEach(
          key => {

            const old =
              originalKeys.find(
                k =>
                  k.id === key.id
              );

            if(old){

              key.time =
                clamp(
                  old.time,
                  line.start,
                  line.end
                );

            }

          }
        );

    }


    clip.style.left =
      timeToX(
        line.start
      ) + "px";

    clip.style.width =
      Math.max(
        40,
        timeToX(
          line.end -
          line.start
        )
      ) + "px";

  }


  function finish(){

    clip.removeEventListener(
      "pointermove",
      move
    );

    clip.removeEventListener(
      "pointerup",
      finish
    );

    clip.removeEventListener(
      "pointercancel",
      finish
    );

    renderAll();

  }


  clip.addEventListener(
    "pointermove",
    move
  );

  clip.addEventListener(
    "pointerup",
    finish
  );

  clip.addEventListener(
    "pointercancel",
    finish
  );

}


/* =========================================================
   PLAYHEAD
   ========================================================= */

function updatePlayhead(){

  const x =
    timeToX(
      state.currentTime
    );

  playhead.style.left =
    x + "px";

  playhead.style.height =
    (
      ruler.offsetHeight +
      waveWrap.offsetHeight +
      track.offsetHeight
    ) + "px";

}


/* =========================================================
   ACTIVE LINE
   ========================================================= */

function getActiveLine(){

  const t =
    state.currentTime;

  return state.lines.find(
    line =>
      t >= line.start &&
      t <= line.end
  ) || null;

}


/* =========================================================
   KEYFRAME INTERPOLATION
   ========================================================= */

function getProgressAt(
  line,
  time
){

  const keys =
    [...line.keyframes]
      .sort(
        (a,b) =>
          a.time - b.time
      );

  if(!keys.length){
    return 0;
  }

  if(
    time <= keys[0].time
  ){

    return keys[0].progress;

  }

  const last =
    keys[keys.length - 1];

  if(
    time >= last.time
  ){

    return last.progress;

  }


  for(
    let i = 0;
    i < keys.length - 1;
    i++
  ){

    const a =
      keys[i];

    const b =
      keys[i+1];

    if(
      time >= a.time &&
      time <= b.time
    ){

      const span =
        b.time -
        a.time;

      if(span <= 0){

        return b.progress;

      }

      const ratio =
        (
          time -
          a.time
        ) / span;

      return (
        a.progress +
        (
          b.progress -
          a.progress
        ) * ratio
      );

    }

  }

  return 0;

}


/* =========================================================
   UPDATE CLIP HIGHLIGHT
   ========================================================= */

function updateClipHighlights(){

  state.lines.forEach(
    line => {

      const clip =
        track.querySelector(
          '.lyric-clip[data-id="' +
          line.id +
          '"]'
        );

      if(!clip){
        return;
      }

      const highlight =
        clip.querySelector(
          ".clip-highlight"
        );

      if(!highlight){
        return;
      }

      const progress =
        getProgressAt(
          line,
          state.currentTime
        );

      if(
        state.currentTime <
        line.start ||
        state.currentTime >
        line.end
      ){

        highlight.style.width =
          "0%";

      }else{

        highlight.style.width =
          clamp(
            progress,
            0,
            100
          ) + "%";

      }

    }
  );

}


/* =========================================================
   PREVIEW
   ========================================================= */

function updatePreview(){

  const line =
    getActiveLine();

  if(!line){

    previewBase.textContent =
      "";

    previewHighlight.textContent =
      "";

    previewHighlight.style.width =
      "0%";

    return;

  }

  previewBase.textContent =
    line.text;

  previewHighlight.textContent =
    line.text;

  const progress =
    getProgressAt(
      line,
      state.currentTime
    );

  previewHighlight.style.width =
    clamp(
      progress,
      0,
      100
    ) + "%";

}


/* =========================================================
   WAVEFORM
   ========================================================= */

function drawWaveform(){

  if(!audioBuffer){

    waveform.width =
      Math.max(
        1,
        timeline.clientWidth
      );

    waveform.height =
      80;

    const ctx =
      waveform.getContext(
        "2d"
      );

    ctx.clearRect(
      0,
      0,
      waveform.width,
      waveform.height
    );

    return;

  }

  const cssWidth =
    Math.max(
      1,
      timeline.clientWidth
    );

  const canvasWidth =
    Math.min(
      cssWidth,
      16000
    );

  waveform.width =
    canvasWidth;

  waveform.height =
    80;

  waveform.style.width =
    cssWidth + "px";

  waveform.style.height =
    "80px";

  const ctx =
    waveform.getContext(
      "2d"
    );

  ctx.clearRect(
    0,
    0,
    canvasWidth,
    80
  );


  const data =
    audioBuffer
      .getChannelData(0);

  const samplesPerPixel =
    data.length /
    canvasWidth;


  ctx.beginPath();

  for(
    let x = 0;
    x < canvasWidth;
    x++
  ){

    const start =
      Math.floor(
        x *
        samplesPerPixel
      );

    const end =
      Math.min(
        data.length,
        Math.floor(
          (x + 1) *
          samplesPerPixel
        )
      );

    let min = 1;

    let max = -1;

    for(
      let i = start;
      i < end;
      i++
    ){

      const value =
        data[i];

      if(value < min){
        min = value;
      }

      if(value > max){
        max = value;
      }

    }

    const y1 =
      40 + min * 35;

    const y2 =
      40 + max * 35;

    ctx.moveTo(
      x,
      y1
    );

    ctx.lineTo(
      x,
      y2
    );

  }

  ctx.strokeStyle =
    "rgba(96,165,250,.65)";

  ctx.lineWidth = 1;

  ctx.stroke();

}

   ZOOM
   ========================================================= */

zoomIn.addEventListener(

  () => {

    state.zoom =
      clamp(
        state.zoom + 20,
        30,
        220
      );

    renderAll();

  }
);


zoomOut.addEventListener(
  "click",

    state.zoom =

        state.zoom - 20,
        30,

      );

    renderAll();

  }

/* =========================================================
   CLICK EMPTY TIMELINE = MOVE PLAYHEAD
   ========================================================= */

timeline.addEventListener(
  "pointerdown",
  event => {

    if(
      event.target.closest(
        ".lyric-clip"
      )
    ){

      return;

    }

    const rect =
      timeline.getBoundingClientRect();

    const x =
      event.clientX -
      rect.left;

    const t =
      clamp(
        xToTime(x),
        0,
        getDuration()
      );

    state.currentTime =
      t;

    if(audio.src){

      audio.currentTime =
        t;

    }

    updatePlayhead();

    updatePreview();

  }
);

/* =========================================================

function updateKeyPanel(){

/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHTML(text){

  return String(text)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================================
   ADD KEYFRAME
   ========================================================= */

plusKey.addEventListener(
  "click",
  () => {

    const line =
      getSelectedLine();

    if(!line){

      alert(
        "Select a lyric line first."
      );

      return;

    }

    const t =
      clamp(
        state.currentTime,
        line.start,
        line.end
      );


    /* If already very close to a keyframe,
       select it instead of making duplicate */

    const existing =
      line.keyframes.find(
        key =>
          Math.abs(
            key.time - t
          ) < 0.05
      );


    if(existing){

      state.selectedKeyId =
        existing.id;

      updateKeyPanel();

      renderLyrics();

      return;

    }


    /* Calculate progress automatically
       from neighboring keyframes */

    const progress =
      getProgressAt(
        line,
        t
      );


    const key = {

      id: uid(),

      time: t,

      progress

    };


    line.keyframes.push(
      key
    );

    line.keyframes.sort(
      (a,b) =>
        a.time - b.time
    );


    state.selectedKeyId =
      key.id;


    renderLyrics();

    updateKeyPanel();

  }
);


/* =========================================================
   DELETE KEYFRAME
   ========================================================= */

minusKey.addEventListener(
  "click",
  () => {

    const line =
      getSelectedLine();

    if(!line){

      alert(
        "Select a lyric line first."
      );

      return;

    }


    if(
      line.keyframes.length <= 1
    ){

      alert(
        "At least one keyframe must remain."
      );

      return;

    }


    let index = -1;


    if(state.selectedKeyId){

      index =
        line.keyframes.findIndex(
          key =>
            key.id ===
            state.selectedKeyId
        );

    }


    /* If no selected keyframe,
       remove nearest to playhead */

    if(index < 0){

      let nearest =
        Infinity;

      line.keyframes.forEach(
        (key,i) => {

          const distance =
            Math.abs(
              key.time -
              state.currentTime
            );

          if(distance < nearest){

            nearest =
              distance;

            index = i;

          }

        }
      );

    }


    if(index >= 0){

      line.keyframes.splice(
        index,
        1
      );

    }


    line.keyframes.sort(
      (a,b) =>
        a.time - b.time
    );


    if(line.keyframes.length){

      state.selectedKeyId =
        line.keyframes[
          Math.max(
            0,
            Math.min(
              index,
              line.keyframes.length - 1
            )
          )
        ].id;

    }else{

      state.selectedKeyId =
        null;

    }


    renderAll();

  }
);

    if(
      t <= line.start + 0.1 ||
      t >= line.end - 0.1
    ){

      alert(
        "Move the playhead inside the lyric line first."
      );

      return;

    }


    const words =
      line.text
        .split(/\s+/)
        .filter(Boolean);


    let leftText =
      line.text;

    let rightText =
      "";


    if(words.length > 1){

      const middle =
        Math.ceil(
          words.length / 2
        );

      leftText =
        words
          .slice(0,middle)
          .join(" ");

      rightText =
        words
          .slice(middle)
          .join(" ");

    }


    const left = {

      id: uid(),

      text: leftText,

      start: line.start,

      end: t,

      keyframes: [

        {
          id: uid(),
          time: line.start,
          progress: 0
        },

        {
          id: uid(),
          time: t,
          progress: 100
        }

      ]

    };


    const right = {

      id: uid(),

      text:
        rightText ||
        line.text,

      start: t,

      end: line.end,

      keyframes: [

        {
          id: uid(),
          time: t,
          progress: 0
        },

        {
          id: uid(),
          time: line.end,
          progress: 100
        }

      ]

    };


    const index =
      state.lines.findIndex(
        x =>
          x.id === line.id
      );


    state.lines.splice(
      index,
      1,
      left,
      right
    );


    state.selectedLineId =
      right.id;

    state.selectedKeyId =
      right.keyframes[0].id;


    renderAll();

  }
);


/* =========================================================
   DUPLICATE LINE
   ========================================================= */

duplicateBtn.addEventListener(
  "click",
  () => {

    const line =
      getSelectedLine();

    if(!line){

      alert(
        "Select a lyric line first."
      );

      return;

    }


    const duration =
      line.end -
      line.start;

    let start =
      line.end + 0.2;

    let end =
      start + duration;


    if(
      end > getDuration()
    ){

      end =
        getDuration();

      start =
        Math.max(
          0,
          end - duration
        );

    }


    const copy = {

      id: uid(),

      text: line.text,

      start,

      end,

      keyframes:
        line.keyframes.map(
          key => ({

            id: uid(),

            time:
              start +
              (
                key.time -
                line.start
              ),

            progress:
              key.progress

          })
        )

    };


    state.lines.push(
      copy
    );

    state.lines.sort(
      (a,b) =>
        a.start - b.start
    );


    state.selectedLineId =
      copy.id;

    state.selectedKeyId =
      copy.keyframes[0]?.id ||
      null;


    renderAll();

  }
);


/* =========================================================
   DELETE LINE
   ========================================================= */

deleteLineBtn.addEventListener(
  "click",
  () => {

    const line =
      getSelectedLine();

    if(!line){

      alert(
        "Select a lyric line first."
      );

      return;

    }


    const ok =
      confirm(
        "Delete this lyric line?"
      );

    if(!ok){
      return;
    }


    state.lines =
      state.lines.filter(
        x =>
          x.id !== line.id
      );


    state.selectedLineId =
      state.lines[0]?.id ||
      null;

    state.selectedKeyId =
      state.lines[0]
        ?.keyframes[0]
        ?.id ||
      null;


    renderAll();

  }
);


/* =========================================================
   SAVE LOCAL
   ========================================================= */

saveBtn.addEventListener(
  "click",
  () => {

    try{

      localStorage.setItem(
        "karaoke_fx_project",
        JSON.stringify(state)
      );

      alert(
        "Project saved on this device."
      );

    }catch(error){

      alert(
        "Could not save project."
      );

    }

  }
);


/* =========================================================
   LOAD LOCAL
   ========================================================= */

loadBtn.addEventListener(
  "click",
  () => {

    try{

      const saved =
        localStorage.getItem(
          "karaoke_fx_project"
        );

      if(!saved){

        alert(
          "No saved project found."
        );

        return;

      }


      const data =
        JSON.parse(saved);


      state = {

        audioName:
          data.audioName || "",

        audioDuration:
          Number(
            data.audioDuration || 0
          ),

        zoom:
          Number(
            data.zoom || 80
          ),

        lines:
          Array.isArray(data.lines)
            ? data.lines
            : [],

        selectedLineId:
          data.selectedLineId ||
          null,

        selectedKeyId:
          data.selectedKeyId ||
          null,

        currentTime:
          Number(
            data.currentTime || 0
          )

      };


      seek.max =
        state.audioDuration;

      seek.value =
        state.currentTime;


      renderAll();


      alert(
        "Project loaded.\n\nNow load the MP3 again if the audio is not already loaded."
      );

    }catch(error){

      console.error(error);

      alert(
        "Could not load saved project."
      );

    }

  }
);


/* =========================================================
   EXPORT JSON
   ========================================================= */

exportBtn.addEventListener(
  "click",
  () => {

    const data =
      JSON.stringify(
        state,
        null,
        2
      );


    const blob =
      new Blob(
        [data],
        {
          type:
            "application/json"
        }
      );


    const url =
      URL.createObjectURL(
        blob
      );


    const a =
      document.createElement(
        "a"
      );

    a.href =
      url;

    a.download =
      "karaoke-project.json";

    document.body.appendChild(a);

    a.click();

    a.remove();

    URL.revokeObjectURL(
      url
    );

  }
);


/* =========================================================
   IMPORT JSON
   ========================================================= */

importBtn.addEventListener(
  "click",
  () => {

    projectInput.click();

  }
);


projectInput.addEventListener(
  "change",
  async event => {

    const file =
      event.target.files[0];

    if(!file){
      return;
    }


    try{

      const text =
        await file.text();

      const data =
        JSON.parse(text);


      state = {

        audioName:
          data.audioName || "",

        audioDuration:
          Number(
            data.audioDuration || 0
          ),

        zoom:
          Number(
            data.zoom || 80
          ),

        lines:
          Array.isArray(data.lines)
            ? data.lines
            : [],

        selectedLineId:
          data.selectedLineId ||
          null,

        selectedKeyId:
          data.selectedKeyId ||
          null,

        currentTime:
          Number(
            data.currentTime || 0
          )

      };


      seek.max =
        state.audioDuration;

      seek.value =
        state.currentTime;


      renderAll();


      alert(
        "Project imported.\n\nLoad the matching MP3 if needed."
      );


    }catch(error){

      console.error(error);

      alert(
        "Invalid project file."
      );

    }


    projectInput.value =
      "";

  }
);


/* =========================================================
   KEYBOARD SHORTCUTS
   ========================================================= */

document.addEventListener(
  "keydown",
  event => {

    const tag =
      document.activeElement?.tagName;


    if(
      tag === "TEXTAREA" ||
      tag === "INPUT"
    ){

      return;

    }


    if(
      event.code ===
      "Space"
    ){

      event.preventDefault();

      playBtn.click();

    }


    if(
      event.key === "+"
    ){

      plusKey.click();

    }


    if(
      event.key === "-"
    ){

      minusKey.click();

    }


    if(
      event.key === "Delete"
    ){

      const line =
        getSelectedLine();

      const key =
        getSelectedKey();

      if(key){

        minusKey.click();

      }else if(line){

        deleteLineBtn.click();

      }

    }

  }
);


/* =========================================================
   PLAYHEAD AUTO SCROLL
   ========================================================= */

function keepPlayheadVisible(){

  const x =
    timeToX(
      state.currentTime
    );

  const left =
    timelineScroll.scrollLeft;

  const right =
    left +
    timelineScroll.clientWidth;

  if(
    x < left + 50
  ){

    timelineScroll.scrollLeft =
      Math.max(
        0,
        x - 100
      );

  }else if(
    x > right - 50
  ){

    timelineScroll.scrollLeft =
      x -
      timelineScroll.clientWidth +
      100;

  }

}


/* =========================================================
   ANIMATION
   ========================================================= */

function animationLoop(){

  if(!audio.paused){

    state.currentTime =
      audio.currentTime;

    updatePlayhead();

    updatePreview();

    updateClipHighlights();

    keepPlayheadVisible();

  }

  requestAnimationFrame(
    animationLoop
  );

}


/* =========================================================
   RESIZE
   ========================================================= */

window.addEventListener(
  "resize",
  () => {

    renderAll();

  }
);


/* =========================================================
   INITIALIZATION
   ========================================================= */

seek.max = 0;

renderAll();

animationLoop();


</script>

</body>
</html>
