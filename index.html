<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Complete Karaoke Editor & Sync Player</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0b0f19; color: #f8fafc; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 4px; }
    
    /* KARAOKE WORD ANIMATION STYLES */
    .word-item {
      display: inline-block;
      font-size: 1.6rem;
      font-weight: 800;
      color: #64748b; /* Inactive lyric color */
      margin: 0 0.25rem;
      padding: 0.1rem 0.3rem;
      border-radius: 6px;
      transition: color 0.15s ease, transform 0.15s ease, text-shadow 0.15s ease;
      cursor: pointer;
    }

    /* Active Highlight / Color Change Animation */
    .word-item.active {
      color: #38bdf8; /* Glowing Cyan/Blue */
      transform: scale(1.18);
      text-shadow: 0 0 15px rgba(56, 189, 248, 0.9), 0 0 25px rgba(56, 189, 248, 0.5);
    }

    .word-item.passed {
      color: #e2e8f0; /* White/Bright Gray for sung words */
    }

    .lyric-line {
      margin-bottom: 1.5rem;
      line-height: 2.2;
      transition: opacity 0.3s ease;
    }

    .lyric-line.active-line {
      opacity: 1;
    }
    
    .lyric-line.inactive-line {
      opacity: 0.4;
    }
  </style>
</head>
<body class="h-screen flex flex-col overflow-hidden select-none">
  <!-- HEADER TOOLBAR -->
  <header class="bg-slate-900 border-b border-slate-800 px-4 py-2.5 flex items-center justify-between shrink-0 z-30">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center text-white font-black text-base shadow-lg shadow-blue-600/30">
        <i class="fa-solid fa-microphone-lines"></i>
      </div>
      <div>
        <h1 class="font-black text-sm text-blue-400 uppercase tracking-wide">Karaoke Studio Pro</h1>
        <p class="text-[10px] text-slate-400">Sync, Edit & Sing Along</p>
      </div>
    </div>

    <!-- MODE SWITCHER -->
    <div class="flex items-center bg-slate-950 p-1 rounded-xl border border-slate-800">
      <button id="tab-edit" onclick="switchTab('edit')" class="px-3 py-1.5 rounded-lg text-xs font-bold text-slate-400">Editor</button>
      <button id="tab-record" onclick="switchTab('record')" class="px-3 py-1.5 rounded-lg text-xs font-bold text-slate-400">Sync Rec</button>
      <button id="tab-play" onclick="switchTab('play')" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-blue-600 text-white shadow-md">Sing Play</button>
    </div>
  </header>

  <!-- CONTROL PANEL -->
  <div class="bg-slate-900 border-b border-slate-800 p-3 flex flex-col gap-2 shrink-0 z-20">
    <div class="flex items-center justify-between gap-2">
      <!-- LOAD MP3 BUTTON -->
      <label class="px-3 py-1.5 bg-blue-950 hover:bg-blue-900 text-blue-400 border border-blue-500/40 rounded-lg text-xs font-bold cursor-pointer flex items-center gap-1.5">
        <i class="fa-solid fa-file-audio"></i> <span>Load MP3 Song</span>
        <input type="file" id="audio-input" accept="audio/*" class="hidden" onchange="handleAudioUpload(event)">
      </label>

      <span id="song-title" class="text-[11px] text-slate-400 truncate max-w-[150px]">Pumili ng MP3 file...</span>

      <!-- SYNC TAP BUTTON (FOR RECORD MODE) -->
      <button id="btn-sync-tap" onclick="registerWordTap()" class="px-4 py-1.5 bg-emerald-600 active:scale-95 text-white font-black rounded-lg text-xs flex items-center gap-1.5 shadow-lg shadow-emerald-600/30">
        <i class="fa-solid fa-hand-pointer"></i> <span>SYNC WORD</span>
      </button>
    </div>

    <!-- AUDIO PLAYER CONTROLS -->
    <div class="flex items-center gap-3">
      <button id="btn-play" onclick="toggleAudio()" class="w-9 h-9 bg-blue-600 text-white rounded-full flex items-center justify-center font-bold text-sm shrink-0 active:scale-95">
        <i class="fa-solid fa-play" id="play-icon"></i>
      </button>

      <input type="range" id="audio-seeker" value="0" min="0" max="100" class="w-full accent-blue-500 h-2 bg-slate-800 rounded-lg cursor-pointer" oninput="seekAudio(event)">

      <span id="time-display" class="text-xs text-slate-300 font-mono shrink-0 font-bold">00:00</span>
    </div>

    <audio id="audio-player"></audio>
  </div>

  <!-- MAIN WORKSPACE -->
  <main class="flex-1 relative overflow-hidden bg-slate-950">
    <!-- 1. TEXT EDITOR VIEW -->
    <div id="view-edit" class="absolute inset-0 p-4 flex flex-col gap-2 hidden">
      <div class="flex justify-between items-center">
        <label class="text-xs font-bold text-blue-400 uppercase">Paste Lyrics Below (1 line per verse):</label>
        <button onclick="exportLRC()" class="text-[10px] bg-slate-800 text-slate-300 px-2.5 py-1 rounded border border-slate-700 hover:bg-slate-700"><i class="fa-solid fa-download"></i> Export Synced Text</button>
      </div>
      <textarea id="lyrics-editor" class="flex-1 w-full bg-slate-900 border border-slate-800 rounded-xl p-4 text-sm text-slate-200 focus:outline-none focus:border-blue-500 resize-none font-mono" placeholder="I-paste ang raw lyrics dito..."></textarea>
      <button onclick="saveEditorText()" class="w-full py-3 bg-blue-600 text-white font-bold rounded-xl text-sm shadow-lg shadow-blue-600/30"><i class="fa-solid fa-check"></i> Save Lyrics & Start</button>
    </div>

    <!-- 2. KARAOKE DISPLAY VIEW (PLAY / RECORD) -->
    <div id="view-play" class="absolute inset-0 overflow-y-auto custom-scrollbar p-6 text-center">
      <div id="karaoke-screen" class="max-w-2xl mx-auto pt-10 pb-32">
        <p class="text-slate-600 italic text-sm">Pumili ng MP3 at pindutin ang Play para magsimula...</p>
      </div>
    </div>
  </main>
  <script>
    // DEFAULT LYRICS DEMO
    let rawLyrics = "Ako'y nananabik sa iyong pagbabalik\nLahat ng luha ay kusa nang mapapawi\nSama-sama tayong aawit sa ligaya";
    
    let wordsData = []; // Array storing: { word: "Ako'y", time: 1.25, lineIdx: 0, wordIdx: 0, el: DOM }
    let activeWordIndex = -1;
    let syncRecordIndex = 0;

    const audio = document.getElementById('audio-player');

    window.onload = () => {
      document.getElementById('lyrics-editor').value = rawLyrics;
      buildKaraokeDisplay();
      setupAudioEngine();
      setupKeyboardControls();
    };

    function handleAudioUpload(e) {
      const file = e.target.files[0];
      if (file) {
        document.getElementById('song-title').innerText = file.name;
        audio.src = URL.createObjectURL(file);
        audio.load();
      }
    }

    function toggleAudio() {
      if (!audio.src) {
        alert("Mag-load muna ng MP3 song!");
        return;
      }
      if (audio.paused) {
        audio.play();
        document.getElementById('play-icon').className = "fa-solid fa-pause";
      } else {
        audio.pause();
        document.getElementById('play-icon').className = "fa-solid fa-play";
      }
    }

    function seekAudio(e) {
      if (!audio.duration) return;
      audio.currentTime = (e.target.value / 100) * audio.duration;
    }

    function setupAudioEngine() {
      audio.ontimeupdate = () => {
        if (!audio.duration) return;

        // Update Seeker Progress
        const progress = (audio.currentTime / audio.duration) * 100;
        document.getElementById('audio-seeker').value = progress;

        // Format Time Display
        const mins = Math.floor(audio.currentTime / 60);
        const secs = Math.floor(audio.currentTime % 60);
        document.getElementById('time-display').innerText = `${mins < 10 ? '0':''}${mins}:${secs < 10 ? '0':''}${secs}`;

        // PLAYBACK KARAOKE ANIMATION
        updateKaraokeHighlight(audio.currentTime);
      };

      audio.onended = () => document.getElementById('play-icon').className = "fa-solid fa-play";
    }

    // RECORD MODE: PRESS SPACEBAR OR CLICK TO SYNC TIME
    function registerWordTap() {
      if (syncRecordIndex < wordsData.length && audio.currentTime > 0) {
        wordsData[syncRecordIndex].time = audio.currentTime;
        
        // Visual indicator that word was recorded
        wordsData[syncRecordIndex].el.classList.add('passed');
        
        syncRecordIndex++;
        if (syncRecordIndex < wordsData.length) {
          wordsData[syncRecordIndex].el.classList.add('active');
        }
      }
    }

    function setupKeyboardControls() {
      document.addEventListener('keydown', (e) => {
        if (e.code === 'Space' && document.activeElement.tagName !== 'TEXTAREA') {
          e.preventDefault();
          const recordTab = document.getElementById('tab-record');
          if (recordTab.classList.contains('bg-blue-600')) {
            registerWordTap();
          } else {
            toggleAudio();
          }
        }
      });
    }

    function updateKaraokeHighlight(currentTime) {
      let currentActiveIdx = -1;

      for (let i = wordsData.length - 1; i >= 0; i--) {
        if (wordsData[i].time >= 0 && currentTime >= wordsData[i].time) {
          currentActiveIdx = i;
          break;
        }
      }

      if (currentActiveIdx !== activeWordIndex) {
        activeWordIndex = currentActiveIdx;

        wordsData.forEach((item, idx) => {
          if (idx < activeWordIndex) {
            item.el.className = "word-item passed";
          } else if (idx === activeWordIndex) {
            item.el.className = "word-item active";
            item.el.scrollIntoView({ behavior: 'smooth', block: 'center' });
          } else {
            item.el.className = "word-item";
          }
        });
      }
    }

    function buildKaraokeDisplay() {
      const container = document.getElementById('karaoke-screen');
      container.innerHTML = '';
      wordsData = [];
      activeWordIndex = -1;

      const lines = rawLyrics.split('\n');

      lines.forEach((lineStr, lineIdx) => {
        if (!lineStr.trim()) return;

        const lineEl = document.createElement('div');
        lineEl.className = 'lyric-line';

        const words = lineStr.trim().split(/\s+/);
        words.forEach((w, wordIdx) => {
          const span = document.createElement('span');
          span.className = 'word-item';
          span.innerText = w;

          // Click word to jump audio directly
          span.onclick = () => {
            const targetData = wordsData.find(item => item.el === span);
            if (targetData && targetData.time >= 0) {
              audio.currentTime = targetData.time;
            }
          };

          lineEl.appendChild(span);

          wordsData.push({
            word: w,
            time: -1, // Unsynced initially
            lineIdx: lineIdx,
            wordIdx: wordIdx,
            el: span
          });
        });

        container.appendChild(lineEl);
      });
    }

    function switchTab(mode) {
      document.getElementById('view-edit').classList.toggle('hidden', mode !== 'edit');
      document.getElementById('view-play').classList.toggle('hidden', mode === 'edit');

      // Style Tab Buttons
      ['edit', 'record', 'play'].forEach(t => {
        const btn = document.getElementById(`tab-${t}`);
        if (t === mode) {
          btn.className = "px-3 py-1.5 rounded-lg text-xs font-bold bg-blue-600 text-white shadow-md";
        } else {
          btn.className = "px-3 py-1.5 rounded-lg text-xs font-bold text-slate-400";
        }
      });

      if (mode === 'record') {
        syncRecordIndex = 0;
        alert("RECORD SYNC MODE:\nI-play ang MP3 at i-press ang SPACEBAR o i-tap ang 'SYNC WORD' button sa bawat salitang binibigkas!");
      }
    }

    function saveEditorText() {
      rawLyrics = document.getElementById('lyrics-editor').value;
      buildKaraokeDisplay();
      switchTab('play');
    }

    function exportLRC() {
      let output = "";
      wordsData.forEach(w => {
        if (w.time >= 0) {
          const m = Math.floor(w.time / 60);
          const s = (w.time % 60).toFixed(2);
          output += `[${m < 10 ? '0':''}${m}:${s < 10 ? '0':''}${s}] ${w.word} `;
        } else {
          output += `${w.word} `;
        }
      });
      navigator.clipboard.writeText(output);
      alert("Naka-copy na sa clipboard ang synced text format!");
    }
  </script>
</body>
</html>
