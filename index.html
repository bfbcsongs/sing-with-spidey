<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111827">
<title>Karaoke Keyframe Editor</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:#0b0f14;
  color:#f3f4f6;
  font-family:Arial,Helvetica,sans-serif;
  overflow:hidden;
}

button,input,textarea{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.app{
  height:100vh;
  display:flex;
  flex-direction:column;
}

/* TOP BAR */
.topbar{
  height:58px;
  min-height:58px;
  background:#111827;
  border-bottom:1px solid #273142;
  display:flex;
  align-items:center;
  gap:8px;
  padding:7px 10px;
  overflow-x:auto;
}

.logo{
  font-weight:800;
  font-size:17px;
  white-space:nowrap;
  margin-right:8px;
}

.topbtn{
  background:#202938;
  color:#e5e7eb;
  padding:9px 12px;
  border-radius:7px;
  white-space:nowrap;
  font-size:13px;
}

.topbtn:hover{
  background:#2d394c;
}

.topbtn.primary{
  background:#2563eb;
  color:white;
}

/* PREVIEW */
.preview{
  height:235px;
  min-height:235px;
  background:#05070a;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
}

.preview-inner{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.preview-title{
  color:#9ca3af;
  font-size:11px;
  position:absolute;
  top:9px;
  left:12px;
  letter-spacing:.5px;
}

.lyric-preview{
  position:relative;
  font-size:clamp(24px,5vw,48px);
  font-weight:800;
  line-height:1.2;
  text-align:center;
  max-width:94%;
  white-space:pre-wrap;
  word-break:break-word;
}

.lyric-base{
  color:#ffffff;
}

.lyric-highlight{
  position:absolute;
  inset:0;
  color:#ffd83d;
  overflow:hidden;
  white-space:pre-wrap;
  word-break:break-word;
  width:0%;
}

.preview-time{
  position:absolute;
  bottom:8px;
  color:#64748b;
  font-size:11px;
}

/* AUDIO BAR */
.audio-bar{
  height:54px;
  min-height:54px;
  background:#111827;
  border-top:1px solid #273142;
  border-bottom:1px solid #273142;
  display:flex;
  align-items:center;
  gap:10px;
  padding:7px 10px;
}

.playbtn{
  width:40px;
  height:40px;
  border-radius:50%;
  background:#2563eb;
  color:white;
  font-size:17px;
  flex:none;
}

.time-display{
  font-size:12px;
  color:#cbd5e1;
  width:92px;
  text-align:center;
  font-variant-numeric:tabular-nums;
}

.audio-seek{
  flex:1;
  accent-color:#3b82f6;
}

.zoom-box{
  display:flex;
  align-items:center;
  gap:5px;
}

.zoom-box button{
  width:27px;
  height:27px;
  background:#202938;
  color:white;
  border-radius:5px;
}

.zoom-value{
  font-size:11px;
  color:#94a3b8;
  width:38px;
  text-align:center;
}

/* EDITOR */
.editor{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
}

.toolbar{
  height:45px;
  min-height:45px;
  background:#111827;
  display:flex;
  align-items:center;
  gap:7px;
  padding:6px 9px;
  border-bottom:1px solid #273142;
  overflow-x:auto;
}

.toolbtn{
  background:#202938;
  color:#dbe4ef;
  border-radius:6px;
  padding:7px 11px;
  font-size:12px;
  white-space:nowrap;
}

.toolbtn.active{
  background:#334155;
}

.toolbtn.add{
  background:#16a34a;
  color:#fff;
  font-weight:700;
}

.toolbtn.delete{
  background:#dc2626;
  color:#fff;
  font-weight:700;
}

.editor-scroll{
  flex:1;
  min-height:0;
  overflow:auto;
  position:relative;
  background:#090d13;
}

.timeline{
  position:relative;
  min-width:100%;
  min-height:100%;
}

/* RULER */
.ruler{
  height:34px;
  position:sticky;
  top:0;
  z-index:20;
  background:#111827;
  border-bottom:1px solid #273142;
  overflow:hidden;
}

.ruler-inner{
  position:absolute;
  top:0;
  height:100%;
}

.tick{
  position:absolute;
  top:0;
  height:100%;
  border-left:1px solid #334155;
  color:#64748b;
  font-size:9px;
  padding-left:3px;
  padding-top:17px;
  pointer-events:none;
}

.tick.major{
  border-left-color:#64748b;
  color:#94a3b8;
}

/* WAVEFORM */
.wave-track{
  height:76px;
  position:relative;
  background:#0d131d;
  border-bottom:1px solid #273142;
}

.wave-canvas{
  position:absolute;
  left:0;
  top:0;
  height:76px;
}

.wave-label{
  position:absolute;
  left:7px;
  top:6px;
  z-index:3;
  font-size:9px;
  color:#64748b;
  background:#0b0f14cc;
  padding:2px 5px;
  border-radius:3px;
}

/* LYRIC TRACK */
.lyric-track{
  position:relative;
  min-height:180px;
  border-bottom:1px solid #273142;
}

.track-label{
  position:absolute;
  left:7px;
  top:8px;
  z-index:5;
  color:#64748b;
  font-size:9px;
  pointer-events:none;
}

.lyric-clip{
  position:absolute;
  height:68px;
  top:43px;
  background:#172235;
  border:1px solid #334155;
  border-radius:7px;
  overflow:visible;
  user-select:none;
  touch-action:none;
}

.lyric-clip.selected{
  border:2px solid #3b82f6;
  background:#1b2a42;
  z-index:10;
}

.clip-body{
  position:absolute;
  inset:0;
  overflow:hidden;
  border-radius:5px;
  cursor:grab;
}

.clip-body:active{
  cursor:grabbing;
}

.clip-text{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  padding:0 14px;
  color:#cbd5e1;
  font-size:14px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.clip-highlight{
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:0%;
  background:rgba(255,216,61,.18);
  pointer-events:none;
}

.clip-highlight-text{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  padding:0 14px;
  color:#ffd83d;
  font-size:14px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  pointer-events:none;
}

.clip-left,
.clip-right{
  position:absolute;
  top:-1px;
  bottom:-1px;
  width:9px;
  z-index:5;
  background:#3b82f6;
  opacity:.85;
  touch-action:none;
}

.clip-left{
  left:-4px;
  cursor:ew-resize;
  border-radius:5px 0 0 5px;
}

.clip-right{
  right:-4px;
  cursor:ew-resize;
  border-radius:0 5px 5px 0;
}

.clip-info{
  position:absolute;
  left:4px;
  bottom:-18px;
  font-size:8px;
  color:#64748b;
  white-space:nowrap;
  pointer-events:none;
}

/* KEYFRAMES */
.keyframe{
  position:absolute;
  top:-10px;
  width:14px;
  height:14px;
  transform:translateX(-50%) rotate(45deg);
  background:#fbbf24;
  border:2px solid #111827;
  border-radius:2px;
  z-index:30;
  cursor:pointer;
  touch-action:none;
}

.keyframe.selected{
  background:#f97316;
  box-shadow:0 0 0 2px #fff,0 0 10px #f97316;
}

/* PLAYHEAD */
.playhead{
  position:absolute;
  top:0;
  bottom:0;
  width:2px;
  background:#ef4444;
  z-index:50;
  pointer-events:none;
}

.playhead-head{
  position:absolute;
  top:0;
  left:50%;
  transform:translateX(-50%);
  width:0;
  height:0;
  border-left:7px solid transparent;
  border-right:7px solid transparent;
  border-top:9px solid #ef4444;
}

/* BOTTOM KEYFRAME PANEL */
.key-panel{
  height:104px;
  min-height:104px;
  background:#111827;
  border-top:1px solid #273142;
  display:flex;
  flex-direction:column;
}

.key-panel-top{
  height:36px;
  display:flex;
  align-items:center;
  gap:7px;
  padding:5px 9px;
}

.key-panel-title{
  font-size:12px;
  font-weight:700;
  margin-right:auto;
}

.kfbtn{
  width:34px;
  height:28px;
  border-radius:5px;
  color:white;
  font-size:17px;
  font-weight:700;
}

.kf-add{
  background:#16a34a;
}

.kf-delete{
  background:#dc2626;
}

.kf-disabled{
  opacity:.35;
}

.key-panel-bottom{
  flex:1;
  display:flex;
  align-items:center;
  gap:10px;
  padding:2px 10px 8px;
}

.progress-label{
  width:80px;
  font-size:11px;
  color:#94a3b8;
}

.progress-range{
  flex:1;
  accent-color:#fbbf24;
}

.progress-number{
  width:42px;
  text-align:right;
  font-size:12px;
  color:#fbbf24;
  font-weight:700;
}

.selected-info{
  width:105px;
  font-size:10px;
  color:#64748b;
  text-align:right;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:#0009;
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.modal.show{
  display:flex;
}

.modal-card{
  width:min(600px,100%);
  max-height:90vh;
  overflow:auto;
  background:#111827;
  border:1px solid #334155;
  border-radius:12px;
  padding:15px;
}

.modal-card h3{
  margin:0 0 12px;
}

.modal-card textarea{
  width:100%;
  min-height:240px;
  resize:vertical;
  background:#0b0f14;
  color:white;
  border:1px solid #334155;
  border-radius:7px;
  padding:10px;
}

.modal-actions{
  display:flex;
  gap:8px;
  justify-content:flex-end;
  margin-top:10px;
}

.modal-actions button{
  padding:9px 13px;
  border-radius:6px;
  background:#334155;
  color:white;
}

.modal-actions .ok{
  background:#2563eb;
}

/* EMPTY */
.empty{
  color:#475569;
  text-align:center;
  padding-top:55px;
  font-size:13px;
}

/* MOBILE */
@media(max-width:600px){
  .topbar{
    height:52px;
    min-height:52px;
  }

  .preview{
    height:190px;
    min-height:190px;
  }

  .audio-bar{
    height:52px;
    min-height:52px;
  }

  .time-display{
    width:72px;
    font-size:10px;
  }

  .toolbar{
    height:42px;
    min-height:42px;
  }

  .key-panel{
    height:96px;
    min-height:96px;
  }

  .clip-text,
  .clip-highlight-text{
    font-size:12px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="logo">🎤 KARAOKE FX</div>

    <button class="topbtn primary" id="audioBtn">🎵 Audio</button>
    <input id="audioFile" type="file" accept="audio/*" hidden>

    <button class="topbtn" id="lyricsBtn">📝 Lyrics</button>

    <button class="topbtn" id="saveBtn">💾 Save</button>
    <button class="topbtn" id="loadBtn">📂 Load</button>

    <button class="topbtn" id="exportBtn">⬇ Export</button>
    <button class="topbtn" id="importBtn">⬆ Import</button>
    <input id="projectFile" type="file" accept=".json,application/json" hidden>
  </div>

  <!-- PREVIEW -->
  <div class="preview">
    <div class="preview-title">KARAOKE PREVIEW</div>

    <div class="preview-inner">
      <div class="lyric-preview">
        <div class="lyric-base" id="previewBase"></div>
        <div class="lyric-highlight" id="previewHighlight"></div>
      </div>
    </div>

    <div class="preview-time" id="previewTime">00:00.000</div>
  </div>

  <!-- AUDIO CONTROLS -->
  <div class="audio-bar">

    <button class="playbtn" id="playBtn">▶</button>

    <div class="time-display">
      <span id="currentTime">00:00.000</span>
      /
      <span id="duration">00:00.000</span>
    </div>

    <input
      class="audio-seek"
      id="audioSeek"
      type="range"
      min="0"
      max="1"
      step="0.001"
      value="0"
    >

    <div class="zoom-box">
      <button id="zoomOut">−</button>
      <div class="zoom-value" id="zoomValue">80px/s</div>
      <button id="zoomIn">+</button>
    </div>

  </div>

  <!-- EDITOR -->
  <div class="editor">

    <div class="toolbar">

      <button class="toolbtn" id="splitBtn">✂ Split</button>
      <button class="toolbtn" id="duplicateBtn">▣ Duplicate</button>
      <button class="toolbtn" id="deleteLineBtn">🗑 Delete Line</button>

      <button class="toolbtn" id="autoKeysBtn">◆ Auto 0→100</button>

      <button class="toolbtn" id="resetKeysBtn">Reset Keys</button>

    </div>

    <div class="editor-scroll" id="editorScroll">

      <div class="timeline" id="timeline">

        <div class="ruler">
          <div class="ruler-inner" id="rulerInner"></div>
        </div>

        <div class="wave-track">
          <div class="wave-label">AUDIO</div>
          <canvas class="wave-canvas" id="waveCanvas"></canvas>
        </div>

        <div class="lyric-track" id="lyricTrack">
          <div class="track-label">LYRICS</div>
        </div>

        <div class="playhead" id="playhead">
          <div class="playhead-head"></div>
        </div>

      </div>

    </div>

  </div>

  <!-- KEYFRAME PANEL -->
  <div class="key-panel">

    <div class="key-panel-top">

      <div class="key-panel-title">
        KEYFRAME
      </div>

      <button class="kfbtn kf-delete" id="minusKey">−</button>
      <button class="kfbtn kf-add" id="plusKey">+</button>

      <div class="selected-info" id="selectedKeyInfo">
        No keyframe
      </div>

    </div>

    <div class="key-panel-bottom">

      <div class="progress-label">
        Shading
      </div>

      <input
        class="progress-range"
        id="progressRange"
        type="range"
        min="0"
        max="100"
        step="1"
        value="0"
      >

      <div class="progress-number" id="progressNumber">
        0%
      </div>

    </div>

  </div>

</div>

<!-- LYRICS MODAL -->
<div class="modal" id="lyricsModal">

  <div class="modal-card">

    <h3>Paste Lyrics</h3>

    <textarea
      id="lyricsInput"
      placeholder="Paste one lyric line per line...

Amazing grace
How sweet the sound
That saved a wretch like me"
    ></textarea>

    <div class="modal-actions">
      <button id="cancelLyrics">Cancel</button>
      <button class="ok" id="applyLyrics">Create Timeline</button>
    </div>

  </div>

</div>

<audio id="audio" preload="metadata"></audio>

<script>
/* ============================================================
   KARAOKE FX EDITOR
   PART 1
   ============================================================ */

const audio = document.getElementById("audio");

const audioBtn = document.getElementById("audioBtn");
const audioFile = document.getElementById("audioFile");

const lyricsBtn = document.getElementById("lyricsBtn");
const lyricsModal = document.getElementById("lyricsModal");
const lyricsInput = document.getElementById("lyricsInput");
const applyLyrics = document.getElementById("applyLyrics");
const cancelLyrics = document.getElementById("cancelLyrics");

const playBtn = document.getElementById("playBtn");
const audioSeek = document.getElementById("audioSeek");

const currentTimeEl = document.getElementById("currentTime");
const durationEl = document.getElementById("duration");
const previewTime = document.getElementById("previewTime");

const timeline = document.getElementById("timeline");
const rulerInner = document.getElementById("rulerInner");
const lyricTrack = document.getElementById("lyricTrack");
const playhead = document.getElementById("playhead");

const waveCanvas = document.getElementById("waveCanvas");

const previewBase = document.getElementById("previewBase");
const previewHighlight = document.getElementById("previewHighlight");

const plusKey = document.getElementById("plusKey");
const minusKey = document.getElementById("minusKey");

const progressRange = document.getElementById("progressRange");
const progressNumber = document.getElementById("progressNumber");
const selectedKeyInfo = document.getElementById("selectedKeyInfo");

const zoomOut = document.getElementById("zoomOut");
const zoomIn = document.getElementById("zoomIn");
const zoomValue = document.getElementById("zoomValue");

const splitBtn = document.getElementById("splitBtn");
const duplicateBtn = document.getElementById("duplicateBtn");
const deleteLineBtn = document.getElementById("deleteLineBtn");
const autoKeysBtn = document.getElementById("autoKeysBtn");
const resetKeysBtn = document.getElementById("resetKeysBtn");

const saveBtn = document.getElementById("saveBtn");
const loadBtn = document.getElementById("loadBtn");
const exportBtn = document.getElementById("exportBtn");
const importBtn = document.getElementById("importBtn");
const projectFile = document.getElementById("projectFile");

const editorScroll = document.getElementById("editorScroll");

let state = {
  audioName: "",
  audioDuration: 0,

  zoom: 80,

  lines: [],

  selectedLineId: null,
  selectedKeyId: null,

  currentTime: 0
};

let audioBuffer = null;


/* ============================================================
   BASIC HELPERS
   ============================================================ */

function uid(prefix = "id"){
  return prefix + "_" +
    Math.random().toString(36).slice(2,9) +
    Date.now().toString(36);
}

function clamp(v,min,max){
  return Math.max(min,Math.min(max,v));
}

function formatTime(seconds){
  seconds = Number(seconds) || 0;

  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  const ms = Math.floor((seconds % 1) * 1000);

  return (
    String(m).padStart(2,"0") +
    ":" +
    String(s).padStart(2,"0") +
    "." +
    String(ms).padStart(3,"0")
  );
}

function formatShortTime(seconds){
  seconds = Number(seconds) || 0;

  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);

  return (
    String(m).padStart(2,"0") +
    ":" +
    String(s).padStart(2,"0")
  );
}

function getDuration(){
  return Number(state.audioDuration) || Number(audio.duration) || 0;
}

function timeToX(time){
  return time * state.zoom;
}

function xToTime(x){
  return x / state.zoom;
}

function selectedLine(){
  return state.lines.find(
    l => l.id === state.selectedLineId
  ) || null;
}

function selectedKey(){
  const line = selectedLine();

  if(!line) return null;

  return line.keyframes.find(
    k => k.id === state.selectedKeyId
  ) || null;
}


/* ============================================================
   AUDIO
   ============================================================ */

audioBtn.addEventListener("click",()=>{
  audioFile.click();
});

audioFile.addEventListener("change",async e=>{

  const file = e.target.files[0];

  if(!file) return;

  state.audioName = file.name;

  const url = URL.createObjectURL(file);

  audio.src = url;

  audio.load();

  try{

    const arrayBuffer = await file.arrayBuffer();

    const AC =
      window.AudioContext ||
      window.webkitAudioContext;

    const ctx = new AC();

    audioBuffer =
      await ctx.decodeAudioData(arrayBuffer);

    drawWaveform();

  }catch(err){

    console.warn("Waveform decode failed",err);

  }

});

audio.addEventListener("loadedmetadata",()=>{

  state.audioDuration = audio.duration || 0;

  durationEl.textContent =
    formatTime(state.audioDuration);

  audioSeek.max =
    state.audioDuration || 1;

  if(state.lines.length === 0){

    renderTimeline();

  }else{

    renderTimeline();

  }

});

audio.addEventListener("timeupdate",()=>{

  state.currentTime = audio.currentTime;

  updatePlaybackUI();

});

audio.addEventListener("ended",()=>{

  playBtn.textContent = "▶";

});

playBtn.addEventListener("click",()=>{

  if(!audio.src){

    alert("Load an audio file first.");

    return;
  }

  if(audio.paused){

    audio.play();

    playBtn.textContent = "❚❚";

  }else{

    audio.pause();

    playBtn.textContent = "▶";

  }

});

audioSeek.addEventListener("input",()=>{

  const t = Number(audioSeek.value) || 0;

  audio.currentTime = t;

  state.currentTime = t;

  updatePlaybackUI();

});


/* ============================================================
   LYRIC INPUT
   ============================================================ */

lyricsBtn.addEventListener("click",()=>{

  lyricsInput.value =
    state.lines.map(l=>l.text).join("\n");

  lyricsModal.classList.add("show");

});

cancelLyrics.addEventListener("click",()=>{

  lyricsModal.classList.remove("show");

});

applyLyrics.addEventListener("click",()=>{

  const text =
    lyricsInput.value.trim();

  if(!text){

    alert("Paste some lyrics first.");

    return;
  }

  createLyrics(text);

  lyricsModal.classList.remove("show");

});


function createLyrics(text){

  const arr =
    text
      .split(/\r?\n/)
      .map(x=>x.trim())
      .filter(Boolean);

  const total =
    getDuration() ||
    Math.max(arr.length * 4,10);

  const defaultLength =
    total / arr.length;

  state.lines = arr.map((text,index)=>{

    const start =
      index * defaultLength;

    const end =
      Math.min(
        total,
        start + defaultLength
      );

    return {

      id:uid("line"),

      text,

      start,

      end,

      keyframes:[
        {
          id:uid("key"),
          time:end,
          progress:100
        }
      ]

    };

  });

  state.selectedLineId =
    state.lines[0]?.id || null;

  state.selectedKeyId = null;

  renderTimeline();

}


/* ============================================================
   RENDER TIMELINE
   ============================================================ */

function renderTimeline(){

  renderRuler();

  renderLyrics();

  updateTimelineWidth();

  updatePlayhead();

  updatePreview();

  updateKeyPanel();

  drawWaveform();

}


function updateTimelineWidth(){

  const duration =
    Math.max(
      getDuration(),
      state.lines.length
        ? Math.max(...state.lines.map(l=>l.end))
        : 10,
      10
    );

  timeline.style.width =
    Math.max(
      duration * state.zoom + 100,
      editorScroll.clientWidth
    ) + "px";

  rulerInner.style.width =
    duration * state.zoom + "px";

  waveCanvas.width =
    Math.max(
      1,
      Math.floor(duration * state.zoom)
    );

  waveCanvas.style.width =
    duration * state.zoom + "px";
}


function renderRuler(){

  rulerInner.innerHTML = "";

  const duration =
    Math.max(getDuration(),10);

  const step =
    state.zoom >= 120 ? 1 :
    state.zoom >= 70 ? 2 :
    state.zoom >= 35 ? 5 :
    10;

  for(
    let t=0;
    t<=duration;
    t+=step
  ){

    const tick =
      document.createElement("div");

    tick.className =
      "tick" +
      (t % (step*5) === 0
        ? " major"
        : "");

    tick.style.left =
      timeToX(t) + "px";

    tick.textContent =
      formatShortTime(t);

    rulerInner.appendChild(tick);

  }

}


/* ============================================================
   RENDER LYRIC CLIPS
   ============================================================ */

function renderLyrics(){

  lyricTrack
    .querySelectorAll(".lyric-clip")
    .forEach(el=>el.remove());

  if(!state.lines.length){

    const empty =
      document.createElement("div");

    empty.className = "empty";
    empty.textContent =
      "Load audio and add lyrics.";

    lyricTrack.appendChild(empty);

    return;
  }

  state.lines.forEach(line=>{

    const clip =
      document.createElement("div");

    clip.className =
      "lyric-clip" +
      (
        line.id === state.selectedLineId
          ? " selected"
          : ""
      );

    clip.dataset.id = line.id;

    clip.style.left =
      timeToX(line.start) + "px";

    clip.style.width =
      Math.max(
        20,
        timeToX(line.end-line.start)
      ) + "px";


    /* BODY */

    const body =
      document.createElement("div");

    body.className =
      "clip-body";

    const highlight =
      document.createElement("div");

    highlight.className =
      "clip-highlight";

    const text =
      document.createElement("div");

    text.className =
      "clip-text";

    text.textContent =
      line.text;

    const highlightText =
      document.createElement("div");

    highlightText.className =
      "clip-highlight-text";

    highlightText.textContent =
      line.text;

    body.appendChild(highlight);
    body.appendChild(text);
    body.appendChild(highlightText);

    clip.appendChild(body);


    /* LEFT RESIZE */

    const left =
      document.createElement("div");

    left.className =
      "clip-left";

    clip.appendChild(left);


    /* RIGHT RESIZE */

    const right =
      document.createElement("div");

    right.className =
      "clip-right";

    clip.appendChild(right);


    /* INFO */

    const info =
      document.createElement("div");

    info.className =
      "clip-info";

    info.textContent =
      `${formatShortTime(line.start)} – ${formatShortTime(line.end)}`;

    clip.appendChild(info);


    /* KEYFRAMES */

    line.keyframes
      .sort((a,b)=>a.time-b.time)
      .forEach(k=>{

        const key =
          document.createElement("div");

        key.className =
          "keyframe" +
          (
            k.id === state.selectedKeyId
              ? " selected"
              : ""
          );

        key.dataset.keyId = k.id;

        const relative =
          clamp(
            (k.time-line.start) /
            Math.max(.001,line.end-line.start),
            0,
            1
          );

        key.style.left =
          (relative * 100) + "%";

        key.title =
          `${formatTime(k.time)} • ${k.progress}%`;

        key.addEventListener(
          "pointerdown",
          ev=>{

            ev.stopPropagation();

            selectLine(line.id);

            state.selectedKeyId =
              k.id;

            updateKeyPanel();

            renderLyrics();

          }
        );

        clip.appendChild(key);

      });


    /* SELECT LINE */

    body.addEventListener(
      "pointerdown",
      ev=>{

        if(ev.target.classList.contains("keyframe"))
          return;

        selectLine(line.id);

        startClipDrag(
          ev,
          line,
          clip
        );

      }
    );


    left.addEventListener(
      "pointerdown",
      ev=>{

        ev.stopPropagation();

        selectLine(line.id);

        startResize(
          ev,
          line,
          clip,
          "left"
        );

      }
    );


    right.addEventListener(
      "pointerdown",
      ev=>{

        ev.stopPropagation();

        selectLine(line.id);

        startResize(
          ev,
          line,
          clip,
          "right"
        );

      }
    );


    lyricTrack.appendChild(clip);

  });

}

/* ============================================================
   DRAG WHOLE LYRIC CLIP
   ============================================================ */

function startClipDrag(ev,line,clip){

  if(ev.button !== undefined && ev.button !== 0)
    return;

  const startX =
    ev.clientX;

  const originalStart =
    line.start;

  const originalEnd =
    line.end;

  const width =
    originalEnd-originalStart;

  const move = e=>{

    const dx =
      e.clientX-startX;

    const dt =
      dx/state.zoom;

    const max =
      Math.max(
        0,
        getDuration() - width
      );

    line.start =
      clamp(
        originalStart + dt,
        0,
        max
      );

    line.end =
      line.start + width;

    /* move keyframes together */

    const delta =
      line.start-originalStart;

    line.keyframes.forEach(k=>{

      k.time =
        clamp(
          k.time+delta,
          line.start,
          line.end
        );

    });

    renderLyrics();

    updatePreview();

  };

  const up = ()=>{

    window.removeEventListener(
      "pointermove",
      move
    );

    window.removeEventListener(
      "pointerup",
      up
    );

  };

  window.addEventListener(
    "pointermove",
    move
  );

  window.addEventListener(
    "pointerup",
    up
  );

}


/* ============================================================
   RESIZE LYRIC CLIP
   ============================================================ */

function startResize(ev,line,clip,side){

  const startX =
    ev.clientX;

  const originalStart =
    line.start;

  const originalEnd =
    line.end;

  const minLength =
    .15;

  const move = e=>{

    const dx =
      e.clientX-startX;

    const dt =
      dx/state.zoom;

    if(side === "left"){

      const newStart =
        clamp(
          originalStart+dt,
          0,
          originalEnd-minLength
        );

      line.start =
        newStart;

      line.keyframes.forEach(k=>{

        k.time =
          clamp(
            k.time,
            line.start,
            line.end
          );

      });

    }else{

      const newEnd =
        clamp(
          originalEnd+dt,
          line.start+minLength,
          getDuration() || originalEnd+dt
        );

      line.end =
        newEnd;

      line.keyframes.forEach(k=>{

        k.time =
          clamp(
            k.time,
            line.start,
            line.end
          );

      });

    }

    renderLyrics();

    updatePreview();

  };

  const up = ()=>{

    window.removeEventListener(
      "pointermove",
      move
    );

    window.removeEventListener(
      "pointerup",
      up
    );

  };

  window.addEventListener(
    "pointermove",
    move
  );

  window.addEventListener(
    "pointerup",
    up
  );

}

/* ============================================================
   FIND ACTIVE LINE
   ============================================================ */

function activeLineAt(time){

  return state.lines.find(
    l =>
      time >= l.start &&
      time <= l.end
  ) || null;

}


/* ============================================================
   KEYFRAME INTERPOLATION
   ============================================================ */

function getProgressAt(line,time){

  if(!line || !line.keyframes.length)
    return 0;

  const keys =
    [...line.keyframes]
      .sort((a,b)=>a.time-b.time);

  if(time <= keys[0].time)
    return keys[0].progress;

  if(time >= keys[keys.length-1].time)
    return keys[keys.length-1].progress;

  for(let i=0;i<keys.length-1;i++){

    const a = keys[i];
    const b = keys[i+1];

    if(
      time >= a.time &&
      time <= b.time
    ){

      const span =
        b.time-a.time;

      const p =
        span <= 0
          ? 1
          : (time-a.time)/span;

      return (
        a.progress +
        (b.progress-a.progress)*p
      );

    }

  }

  return 0;

}


/* ============================================================
   CLIP HIGHLIGHT
   ============================================================ */

function updateClipHighlights(){

  state.lines.forEach(line=>{

    const clip =
      lyricTrack.querySelector(
        `[data-id="${line.id}"]`
      );

    if(!clip) return;

    const highlight =
      clip.querySelector(
        ".clip-highlight"
      );

    const htext =
      clip.querySelector(
        ".clip-highlight-text"
      );

    const p =
      getProgressAt(
        line,
        state.currentTime
      );

    const active =
      state.currentTime >= line.start &&
      state.currentTime <= line.end;

    const width =
      active
        ? p
        : (
            state.currentTime > line.end
              ? getProgressAt(line,line.end)
              : 0
          );

    highlight.style.width =
      width + "%";

    htext.style.clipPath =
      `inset(0 ${100-width}% 0 0)`;

  });

}


/* ============================================================
   PREVIEW
   ============================================================ */

function updatePreview(){

  const line =
    activeLineAt(
      state.currentTime
    );

  if(!line){

    previewBase.textContent = "";
    previewHighlight.textContent = "";

    return;
  }

  previewBase.textContent =
    line.text;

  previewHighlight.textContent =
    line.text;

  const p =
    getProgressAt(
      line,
      state.currentTime
    );

  previewHighlight.style.width =
    p + "%";

}

/* ============================================================
   WAVEFORM
   ============================================================ */

function drawWaveform(){

  const ctx =
    waveCanvas.getContext("2d");

  const duration =
    getDuration();

  const width =
    Math.max(
      1,
      Math.floor(duration * state.zoom)
    );

  const height = 76;

  waveCanvas.width = width;
  waveCanvas.height = height;

  ctx.clearRect(
    0,0,width,height
  );

  if(!audioBuffer){

    /* fallback grid */

    ctx.strokeStyle =
      "#243244";

    ctx.lineWidth = 1;

    for(let x=0;x<width;x+=state.zoom){

      ctx.beginPath();

      ctx.moveTo(x,0);
      ctx.lineTo(x,height);

      ctx.stroke();

    }

    return;
  }

  const data =
    audioBuffer.getChannelData(0);

  const samplesPerPixel =
    Math.max(
      1,
      Math.floor(
        data.length/width
      )
    );

  ctx.strokeStyle =
    "#3b82f6";

  ctx.globalAlpha = .75;

  ctx.beginPath();

  for(let x=0;x<width;x++){

    const start =
      x*samplesPerPixel;

    const end =
      Math.min(
        data.length,
        start+samplesPerPixel
      );

    let min = 1;
    let max = -1;

    for(
      let i=start;
      i<end;
      i++
    ){

      const v=data[i];

      if(v<min) min=v;
      if(v>max) max=v;

    }

    const y1 =
      (1+min)*height/2;

    const y2 =
      (1+max)*height/2;

    ctx.moveTo(x,y1);
    ctx.lineTo(x,y2);

  }

  ctx.stroke();

  ctx.globalAlpha = 1;

}

/* ============================================================
   KEYFRAME PANEL
   ============================================================ */

function updateKeyPanel(){

  const line =
    selectedLine();

  const key =
    selectedKey();

  if(!line){

    selectedKeyInfo.textContent =
      "Select a lyric";

    progressRange.disabled = true;

    progressNumber.textContent =
      "0%";

    return;
  }

  if(!key){

    selectedKeyInfo.textContent =
      "Tap ♦ or +";

    progressRange.disabled = true;

    progressNumber.textContent =
      "—";

    return;
  }

  progressRange.disabled = false;

  progressRange.value =
    key.progress;

  progressNumber.textContent =
    Math.round(key.progress) + "%";

  selectedKeyInfo.textContent =
    formatTime(key.time);

}


/* ============================================================
   ADD KEYFRAME
   ============================================================ */

plusKey.addEventListener("click",()=>{

  const line =
    selectedLine();

  if(!line){

    alert("Select a lyric line first.");

    return;
  }

  const time =
    clamp(
      state.currentTime,
      line.start,
      line.end
    );

  /* If there is already a keyframe very close,
     select it instead of creating another one. */

  const existing =
    line.keyframes.find(
      k =>
        Math.abs(k.time-time) < .04
    );

  if(existing){

    state.selectedKeyId =
      existing.id;

    updateKeyPanel();

    renderLyrics();

    return;
  }

  let progress = 0;

  const keys =
    [...line.keyframes]
      .sort((a,b)=>a.time-b.time);

  if(keys.length === 0){

    progress = 0;

  }else if(
    time <= keys[0].time
  ){

    progress =
      keys[0].progress;

  }else if(
    time >= keys[keys.length-1].time
  ){

    progress =
      keys[keys.length-1].progress;

  }else{

    for(let i=0;i<keys.length-1;i++){

      const a=keys[i];
      const b=keys[i+1];

      if(
        time>=a.time &&
        time<=b.time
      ){

        const ratio =
          (time-a.time) /
          Math.max(
            .0001,
            b.time-a.time
          );

        progress =
          a.progress +
          (b.progress-a.progress)*ratio;

        break;

      }

    }

  }

  const newKey = {

    id:uid("key"),

    time,

    progress

  };

  line.keyframes.push(newKey);

  line.keyframes.sort(
    (a,b)=>a.time-b.time
  );

  state.selectedKeyId =
    newKey.id;

  renderLyrics();

  updateKeyPanel();

  updatePreview();

});


/* ============================================================
   DELETE KEYFRAME
   ============================================================ */

minusKey.addEventListener("click",()=>{

  const line =
    selectedLine();

  if(!line) return;

  const key =
    selectedKey();

  if(!key){

    /* If no key is selected,
       find the nearest keyframe */

    if(!line.keyframes.length)
      return;

    const nearest =
      [...line.keyframes]
        .sort(
          (a,b)=>
            Math.abs(a.time-state.currentTime) -
            Math.abs(b.time-state.currentTime)
        )[0];

    const index =
      line.keyframes.indexOf(nearest);

    if(index !== -1){

      line.keyframes.splice(index,1);

    }

  }else{

    const index =
      line.keyframes.indexOf(key);

    if(index !== -1){

      line.keyframes.splice(index,1);

    }

    state.selectedKeyId = null;

  }

  /* Keep at least one keyframe */

  if(line.keyframes.length === 0){

    line.keyframes.push({
      id:uid("key"),
      time:line.start,
      progress:0
    });

  }

  renderLyrics();

  updateKeyPanel();

  updatePreview();

});

/* ============================================================
   SPLIT LYRIC AT PLAYHEAD
   ============================================================ */

splitBtn.addEventListener("click",()=>{

  const line =
    selectedLine();

  if(!line){

    alert("Select a lyric line first.");

    return;
  }

  const t =
    state.currentTime;

  if(
    t <= line.start+.1 ||
    t >= line.end-.1
  ){

    alert(
      "Move the playhead inside the lyric line."
    );

    return;
  }

  const leftText =
    line.text;

  const words =
    leftText.split(/\s+/);

  let firstText =
    leftText;

  let secondText =
    leftText;

  if(words.length > 1){

    const mid =
      Math.ceil(words.length/2);

    firstText =
      words.slice(0,mid).join(" ");

    secondText =
      words.slice(mid).join(" ");

  }

  const leftLine = {

    id:uid("line"),

    text:firstText,

    start:line.start,

    end:t,

    keyframes:[

      {
        id:uid("key"),
        time:line.start,
        progress:0
      },

      {
        id:uid("key"),
        time:t,
        progress:100
      }

    ]

  };

  const rightLine = {

    id:uid("line"),

    text:secondText,

    start:t,

    end:line.end,

    keyframes:[

      {
        id:uid("key"),
        time:t,
        progress:0
      },

      {
        id:uid("key"),
        time:line.end,
        progress:100
      }

    ]

  };

  const index =
    state.lines.indexOf(line);

  state.lines.splice(
    index,
    1,
    leftLine,
    rightLine
  );

  state.selectedLineId =
    rightLine.id;

  state.selectedKeyId = null;

  renderTimeline();

});


/* ============================================================
   DUPLICATE LYRIC
   ============================================================ */

duplicateBtn.addEventListener("click",()=>{

  const line =
    selectedLine();

  if(!line){

    alert("Select a lyric line first.");

    return;
  }

  const length =
    line.end-line.start;

  const newStart =
    Math.min(
      line.end+.2,
      Math.max(
        0,
        getDuration()-length
      )
    );

  const newLine = {

    id:uid("line"),

    text:line.text,

    start:newStart,

    end:newStart+length,

    keyframes:
      line.keyframes.map(k=>({

        id:uid("key"),

        time:
          newStart+
          (k.time-line.start),

        progress:k.progress

      }))

  };

  const index =
    state.lines.indexOf(line);

  state.lines.splice(
    index+1,
    0,
    newLine
  );

  state.selectedLineId =
    newLine.id;

  state.selectedKeyId = null;

  renderTimeline();

});


/* ============================================================
   DELETE LYRIC
   ============================================================ */

deleteLineBtn.addEventListener("click",()=>{

  const line =
    selectedLine();

  if(!line) return;

  if(
    !confirm(
      "Delete this lyric line?"
    )
  ) return;

  const index =
    state.lines.indexOf(line);

  state.lines.splice(
    index,
    1
  );

  state.selectedLineId =
    state.lines[index]?.id ||
    state.lines[index-1]?.id ||
    null;

  state.selectedKeyId = null;

  renderTimeline();

});


/* ============================================================
   CLICK EMPTY TIMELINE = MOVE PLAYHEAD
   ============================================================ */

lyricTrack.addEventListener(
  "pointerdown",
  ev=>{

    if(
      ev.target.closest(".lyric-clip")
    ){
      return;
    }

    const rect =
      lyricTrack.getBoundingClientRect();

    const x =
      ev.clientX -
      rect.left;

    const time =
      clamp(
        x/state.zoom,
        0,
        getDuration()
      );

    audio.currentTime =
      time;

    state.currentTime =
      time;

    updatePlaybackUI();

  }
);

      );

    audio.currentTime =

    state.currentTime =

    updatePlaybackUI();

  }
);

      state,
      null,
      2
    );

  const blob =
    new Blob(
      [data],
      {
        type:"application/json"
      }
    );

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href=url;

  a.download =
    "karaoke-project.json";

  a.click();

  URL.revokeObjectURL(url);

});


/* ============================================================
   IMPORT JSON
   ============================================================ */

importBtn.addEventListener("click",()=>{

  projectFile.click();

});

projectFile.addEventListener(
  "change",
  async e=>{

    const file =
      e.target.files[0];

    if(!file) return;

    try{

      const text =
        await file.text();

      const data =
        JSON.parse(text);

      state = {

        ...state,

        ...data

      };

      zoomValue.textContent =
        state.zoom + "px/s";

      renderTimeline();

      alert(
        "Project imported.\n\n" +
        "Load the same audio file to continue editing."
      );

    }catch(err){

      alert(
        "Invalid project file."
      );

    }

  }
);


/* ============================================================
   KEYBOARD SHORTCUTS
   ============================================================ */

document.addEventListener(
  "keydown",
  e=>{

    /* Don't interfere with typing */

    if(
      e.target.tagName === "INPUT" ||
      e.target.tagName === "TEXTAREA"
    ){
      return;
    }

    if(e.code === "Space"){

      e.preventDefault();

      playBtn.click();

    }

    if(e.key === "+"){

      plusKey.click();

    }

    if(e.key === "-"){

      minusKey.click();

    }

    if(e.key === "Delete"){

      const line =
        selectedLine();

      const key =
        selectedKey();

      if(key){

        minusKey.click();

      }else if(line){

        deleteLineBtn.click();

      }

    }

  }
);


/* ============================================================
   CLICK KEYFRAME ON TIMELINE
   ============================================================ */

document.addEventListener(
  "pointerdown",
  ev=>{

    const key =
      ev.target.closest(
        ".keyframe"
      );

    if(!key) return;

    const clip =
      key.closest(
        ".lyric-clip"
      );

    if(!clip) return;

    const line =
      state.lines.find(
        l=>l.id===clip.dataset.id
      );

    if(!line) return;

    const keyId =
      key.dataset.keyId;

    const k =
      line.keyframes.find(
        x=>x.id===keyId
      );

    if(!k) return;

    state.selectedLineId =
      line.id;

    state.selectedKeyId =
      k.id;

    updateKeyPanel();

  }
);


/* ============================================================
   AUTO SCROLL TO PLAYHEAD
   ============================================================ */

function keepPlayheadVisible(){

  const x =
    timeToX(
      state.currentTime
    );

  const left =
    editorScroll.scrollLeft;

  const right =
    left +
    editorScroll.clientWidth;

  if(x < left+80){

    editorScroll.scrollLeft =
      Math.max(
        0,
        x-120
      );

  }else if(x > right-80){

    editorScroll.scrollLeft =
      x-
      editorScroll.clientWidth+
      120;

  }

}


/* ============================================================
   UPDATE LOOP
   ============================================================ */

function animationLoop(){

  if(!audio.paused){

    state.currentTime =
      audio.currentTime;

    updatePlaybackUI();

  }

  requestAnimationFrame(
    animationLoop
  );

}

requestAnimationFrame(
  animationLoop
);


/* ============================================================
   INITIAL STATE
   ============================================================ */

zoomValue.textContent =
  state.zoom + "px/s";

audioSeek.value = 0;

renderTimeline();

updateKeyPanel();


/* ============================================================
   PREVENT CONTEXT MENU ON TIMELINE
   ============================================================ */

editorScroll.addEventListener(
  "contextmenu",
  e=>e.preventDefault()
);


/* ============================================================
   FINAL INITIALIZATION
   ============================================================ */

window.addEventListener(
  "resize",
  ()=>{

    updateTimelineWidth();

    drawWaveform();

  }
);

</script>
