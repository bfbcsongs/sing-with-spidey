<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b1020">
<title>Karaoke FX Editor</title>

<style>
*{
 box-sizing:border-box;
 -webkit-tap-highlight-color:transparent;
}

html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 background:#080c16;
 color:#fff;
 font-family:Arial,sans-serif;
}

button,input,textarea{
 font:inherit;
}

button{
 border:0;
 border-radius:8px;
 background:#263244;
 color:#fff;
 padding:10px 13px;
}

button:active{
 transform:scale(.96);
}

.app{
 width:100%;
 height:100%;
 display:flex;
 flex-direction:column;
}

/* TOP */

.top{
 height:56px;
 min-height:56px;
 display:flex;
 align-items:center;
 gap:6px;
 padding:6px;
 background:#111827;
 border-bottom:1px solid #374151;
 overflow-x:auto;
}

.logo{
 font-size:14px;
 font-weight:bold;
 white-space:nowrap;
 margin-right:3px;
}

.top button{
 white-space:nowrap;
 font-size:12px;
}

.mp3{
 background:#2563eb;
}

/* PREVIEW */

.preview{
 height:130px;
 min-height:130px;
 display:flex;
 align-items:center;
 justify-content:center;
 background:#02050b;
 border-bottom:1px solid #374151;
}

.previewText{
 position:relative;
 max-width:95%;
 font-size:28px;
 font-weight:bold;
 text-align:center;
 line-height:1.2;
 text-shadow:0 2px 5px #000;
}

.previewBase{
 white-space:pre-wrap;
}

.previewHi{
 position:absolute;
 left:0;
 top:0;
 height:100%;
 width:0%;
 overflow:hidden;
 color:#ffe600;
 white-space:pre-wrap;
}

/* AUDIO */

.audio{
 height:54px;
 min-height:54px;
 display:flex;
 align-items:center;
 gap:7px;
 padding:6px;
 background:#111827;
 border-bottom:1px solid #374151;
}

.play{
 width:42px;
 height:40px;
 padding:0;
 background:#2563eb;
 font-size:18px;
}

.time{
 width:92px;
 text-align:center;
 font-size:11px;
 color:#d1d5db;
}

.seek{
 flex:1;
}

.zoom{
 display:flex;
 gap:4px;
}

.zoom button{
 padding:7px 10px;
}

/* TOOLBAR */

.toolbar{
 height:46px;
 min-height:46px;
 display:flex;
 align-items:center;
 gap:5px;
 padding:5px;
 background:#151c2c;
 border-bottom:1px solid #374151;
 overflow-x:auto;
}

.toolbar button{
 font-size:11px;
 white-space:nowrap;
}

/* TIMELINE */

.editor{
 flex:1;
 min-height:0;
 overflow:hidden;
}

.scroll{
 width:100%;
 height:100%;
 overflow:auto;
 position:relative;
 background:#080d18;
}

.timeline{
 position:relative;
 min-height:100%;
}

/* RULER */

.ruler{
 height:32px;
 position:relative;
 background:#111827;
 border-bottom:1px solid #374151;
}

.tick{
 position:absolute;
 top:0;
 height:100%;
 border-left:1px solid #4b5563;
 color:#9ca3af;
 font-size:9px;
 padding-left:3px;
}

/* WAVEFORM */

.wave{
 height:70px;
 position:relative;
 background:#0d1525;
 border-bottom:1px solid #263244;
}

#waveCanvas{
 position:absolute;
 left:0;
 top:0;
 height:70px;
}

/* TRACK */

.track{
 position:relative;
 min-height:500px;
}

.grid{
 position:absolute;
 inset:0;
 pointer-events:none;
}

.gridLine{
 position:absolute;
 top:0;
 bottom:0;
 border-left:1px solid rgba(148,163,184,.08);
}

/* LYRIC */

.clip{
 position:absolute;
 height:62px;
 background:#172033;
 border:1px solid #475569;
 border-radius:8px;
 touch-action:none;
 user-select:none;
}

.clip.selected{
 border:2px solid #38bdf8;
}

.clipBody{
 position:absolute;
 left:5px;
 right:5px;
 top:5px;
 bottom:5px;
 overflow:hidden;
 border-radius:5px;
 background:#202b3e;
}

.clipText{
 position:absolute;
 inset:0;
 display:flex;
 align-items:center;
 padding:0 9px;
 font-size:13px;
 font-weight:bold;
 white-space:nowrap;
 overflow:hidden;
 color:#dbeafe;
}

.clipFill{
 position:absolute;
 left:0;
 top:0;
 bottom:0;
 width:0%;
 overflow:hidden;
 background:rgba(250,204,21,.25);
}

.clipFillText{
 position:absolute;
 left:0;
 top:0;
 bottom:0;
 width:100%;
 display:flex;
 align-items:center;
 padding:0 9px;
 color:#ffe600;
 font-size:13px;
 font-weight:bold;
 white-space:nowrap;
}

.handle{
 position:absolute;
 top:0;
 bottom:0;
 width:12px;
 z-index:20;
}

.leftHandle{
 left:-6px;
 cursor:ew-resize;
}

.rightHandle{
 right:-6px;
 cursor:ew-resize;
}

.clipTime{
 position:absolute;
 left:5px;
 bottom:-17px;
 color:#64748b;
 font-size:9px;
 white-space:nowrap;
}

/* KEYFRAME */

.key{
 position:absolute;
 top:-11px;
 width:22px;
 height:22px;
 margin-left:-11px;
 z-index:30;
 color:#facc15;
 font-size:17px;
 line-height:22px;
 text-align:center;
}

.key.selected{
 color:#38bdf8;
 transform:scale(1.25);
}

/* PLAYHEAD */

.playhead{
 position:absolute;
 top:0;
 width:2px;
 background:#ef4444;
 z-index:100;
 pointer-events:none;
}

.playheadHead{
 position:absolute;
 left:-7px;
 top:0;
 width:16px;
 height:16px;
 background:#ef4444;
 clip-path:polygon(50% 100%,0 0,100% 0);
}

/* KEY PANEL */

.keys{
 height:88px;
 min-height:88px;
 display:flex;
 align-items:center;
 gap:9px;
 padding:7px;
 background:#111827;
 border-top:1px solid #374151;
}

.keyButton{
 width:46px;
 height:46px;
 padding:0;
 font-size:25px;
 font-weight:bold;
}

.addKey{
 background:#16a34a;
}

.delKey{
 background:#dc2626;
}

.keyInfo{
 width:105px;
 min-width:105px;
 font-size:10px;
 color:#cbd5e1;
}

.sliderBox{
 flex:1;
}

.sliderTitle{
 display:flex;
 justify-content:space-between;
 font-size:10px;
 margin-bottom:3px;
 color:#cbd5e1;
}

.slider{
 width:100%;
}

/* EMPTY */

.empty{
 position:absolute;
 top:170px;
 left:50%;
 transform:translateX(-50%);
 color:#64748b;
 text-align:center;
 width:280px;
}

/* MODAL */

.modal{
 position:fixed;
 inset:0;
 display:none;
 align-items:center;
 justify-content:center;
 background:rgba(0,0,0,.75);
 z-index:1000;
 padding:12px;
}

.modal.show{
 display:flex;
}

.modalBox{
 width:min(700px,100%);
 background:#111827;
 border:1px solid #374151;
 border-radius:12px;
 overflow:hidden;
}

.modalTitle{
 padding:12px;
 font-weight:bold;
 border-bottom:1px solid #374151;
}

.modalBody{
 padding:10px;
}

#lyrics{
 width:100%;
 height:320px;
 resize:none;
 background:#070b13;
 color:#fff;
 border:1px solid #475569;
 border-radius:8px;
 padding:12px;
 outline:none;
}

.modalButtons{
 display:flex;
 justify-content:flex-end;
 gap:7px;
 padding:10px;
 border-top:1px solid #374151;
}

.modalButtons button{
 min-width:90px;
}

@media(max-width:600px){

 .logo{
  font-size:12px;
 }

 .preview{
  height:115px;
  min-height:115px;
 }

 .previewText{
  font-size:22px;
 }

 .keyInfo{
  width:85px;
  min-width:85px;
 }

}
</style>
</head>

<body>

<div class="top">

>

>

</div>


<div class="preview">

<div class="previewText">

<div
 id="previewBase"

></div>

<div class="audio">

<script>
  /* =====================================================
   PART 2 — BASIC FUNCTIONS + MP3 + LYRICS
   ===================================================== */

const audio =
document.getElementById("audio");

const mp3Btn =
document.getElementById("mp3Btn");

const mp3Input =
document.getElementById("mp3Input");

const lyricsBtn =
document.getElementById("lyricsBtn");

const lyricsModal =
document.getElementById("lyricsModal");

const lyrics =
document.getElementById("lyrics");

const applyLyrics =
document.getElementById("applyLyrics");

const cancelLyrics =
document.getElementById("cancelLyrics");

const playBtn =
document.getElementById("playBtn");

const seek =
document.getElementById("seek");

const time =
document.getElementById("time");

const timeline =
document.getElementById("timeline");

const scroll =
document.getElementById("scroll");

const ruler =
document.getElementById("ruler");

const track =
document.getElementById("track");

const grid =
document.getElementById("grid");

const playhead =
document.getElementById("playhead");

const previewBase =
document.getElementById("previewBase");

const previewHi =
document.getElementById("previewHi");

const empty =
document.getElementById("empty");

const progress =
document.getElementById("progress");

const sliderValue =
document.getElementById("sliderValue");

const keyInfo =
document.getElementById("keyInfo");

const zoomPlus =
document.getElementById("zoomPlus");

const zoomMinus =
document.getElementById("zoomMinus");

const plusKey =
document.getElementById("plusKey");

const minusKey =
document.getElementById("minusKey");

const splitBtn =
document.getElementById("splitBtn");

const duplicateBtn =
document.getElementById("duplicateBtn");

const deleteBtn =
document.getElementById("deleteBtn");

const autoBtn =
document.getElementById("autoBtn");

const resetBtn =
document.getElementById("resetBtn");

const saveBtn =
document.getElementById("saveBtn");

const loadBtn =
document.getElementById("loadBtn");

const exportBtn =
document.getElementById("exportBtn");

const importBtn =
document.getElementById("importBtn");

const jsonInput =
document.getElementById("jsonInput");

const waveCanvas =
document.getElementById("waveCanvas");


/* =========================
   STATE
   ========================= */

let state = {

 audioName:"",
 duration:0,

 zoom:80,

 currentTime:0,

 lines:[],

 selectedLine:null,

 selectedKey:null

};


let audioURL = null;

let audioBuffer = null;

let audioContext = null;


/* =========================
   HELPERS
   ========================= */

function uid(){

 return Date.now().toString(36)
 + Math.random()
   .toString(36)
   .slice(2);

}


function clamp(v,min,max){

 return Math.max(
  min,
  Math.min(max,v)
 );

}


function fmt(sec){

 if(!isFinite(sec))
  sec=0;

 sec=Math.max(0,sec);

 const m=
 Math.floor(sec/60)
 .toString()
 .padStart(2,"0");

 const s=
 Math.floor(sec%60)
 .toString()
 .padStart(2,"0");

 return m+":"+s;

}


function xFromTime(t){

 return t*state.zoom;

}


function timeFromX(x){

 return x/state.zoom;

}


function selectedLine(){

 return state.lines.find(
  l=>l.id===state.selectedLine
 ) || null;

}


function selectedKey(){

 const line=selectedLine();

 if(!line)
  return null;

 return line.keyframes.find(
  k=>k.id===state.selectedKey
 ) || null;

}


/* =========================
   MP3 BUTTON
   ========================= */

mp3Btn.onclick=function(){

 mp3Input.click();

};


mp3Input.onchange=function(e){

 const file=e.target.files[0];

 if(!file)
  return;

 if(audioURL)
  URL.revokeObjectURL(audioURL);

 audioURL=
 URL.createObjectURL(file);

 audio.src=audioURL;

 state.audioName=file.name;

 audio.load();

};


/* =========================
   MP3 LOADED
   ========================= */

audio.onloadedmetadata=function(){

 state.duration=
 audio.duration || 0;

 state.currentTime=0;

 seek.max=state.duration;

 seek.value=0;

 time.textContent=
 "00:00 / "+fmt(state.duration);

 render();

 decodeWave();

};


/* =========================
   DECODE WAVEFORM
   ========================= */

async function decodeWave(){

 try{

  if(!audioURL)
   return;

  if(!audioContext){

   audioContext=
   new (
    window.AudioContext ||
    window.webkitAudioContext
   )();

  }

  const response=
  await fetch(audioURL);

  const buffer=
  await response.arrayBuffer();

  audioBuffer=
  await audioContext.decodeAudioData(
   buffer
  );

  drawWave();

 }catch(err){

  console.log(
   "Waveform unavailable",
   err
  );

 }

}


/* =========================
   PLAY
   ========================= */

playBtn.onclick=function(){

 if(!audio.src){

  mp3Btn.click();

  return;

 }

 if(audio.paused){

  audio.play();

 }else{

  audio.pause();

 }

};


audio.onplay=function(){

 playBtn.textContent="⏸";

};


audio.onpause=function(){

 playBtn.textContent="▶";

};


audio.onended=function(){

 playBtn.textContent="▶";

};


/* =========================
   TIME UPDATE
   ========================= */

audio.ontimeupdate=function(){

 state.currentTime=
 audio.currentTime;

 seek.value=
 audio.currentTime;

 time.textContent=
 fmt(audio.currentTime)
 +" / "
 +fmt(state.duration);

 updatePlayhead();

 updatePreview();

 updateHighlights();

};


seek.oninput=function(){

 const t=
 Number(seek.value);

 audio.currentTime=t;

 state.currentTime=t;

 updatePlayhead();

 updatePreview();

};


/* =========================
   LYRICS MODAL
   ========================= */

lyricsBtn.onclick=function(){

 lyricsModal.classList.add("show");

 lyrics.focus();

};


cancelLyrics.onclick=function(){

 lyricsModal.classList.remove("show");

};


lyricsModal.onclick=function(e){

 if(e.target===lyricsModal){

  lyricsModal.classList.remove(
   "show"
  );

 }

};


/* =========================
   APPLY LYRICS
   ========================= */

applyLyrics.onclick=function(){

 const raw=
 lyrics.value.trim();

 if(!raw){

  alert(
   "Paste your lyrics first."
  );

  return;

 }

 if(state.duration<=0){

  alert(
   "Please load the MP3 first."
  );

  return;

 }


 const arr=
 raw.split(/\r?\n/)
 .map(x=>x.trim())
 .filter(Boolean);


 state.lines=[];


 const gap=
 state.duration/arr.length;


 arr.forEach(
 (text,index)=>{

  const start=
  index*gap;

  const end=
  index===arr.length-1
   ?state.duration
   :(index+1)*gap;


  state.lines.push({

   id:uid(),

   text:text,

   start:start,

   end:end,

   keyframes:[

    {
     id:uid(),
     time:start,
     progress:0
    },

    {
     id:uid(),
     time:end,
     progress:100
    }

   ]

  });

 }
 );


 if(state.lines.length){

  state.selectedLine=
  state.lines[0].id;

  state.selectedKey=
  state.lines[0]
  .keyframes[0].id;

 }


 lyricsModal.classList.remove(
  "show"
 );

 render();

};


/* =========================
   ZOOM
   ========================= */

zoomPlus.onclick=function(){

 state.zoom=
 clamp(
  state.zoom+20,
  30,
  220
 );

 render();

};


zoomMinus.onclick=function(){

 state.zoom=
 clamp(
  state.zoom-20,
  30,
  220
 );

 render();

};


/* =========================
   TIMELINE SIZE
   ========================= */

function timelineWidth(){

 const duration=
 Math.max(
  state.duration,
  30
 );

 return Math.max(
  duration*state.zoom,
  scroll.clientWidth
 );

}


function updateTimelineSize(){

 timeline.style.width=
 timelineWidth()+"px";

}


/* =========================
   RULER
   ========================= */

function drawRuler(){

 ruler.innerHTML="";

 const duration=
 Math.max(
  state.duration,
  30
 );

 const step=
 state.zoom>=100
 ?1
 :state.zoom>=60
 ?2
 :5;


 for(
  let t=0;
  t<=duration;
  t+=step
 ){

  const el=
  document.createElement("div");

  el.className="tick";

  el.style.left=
  xFromTime(t)+"px";

  el.textContent=fmt(t);

  ruler.appendChild(el);

 }

}


/* =========================
   GRID
   ========================= */

function drawGrid(){

 grid.innerHTML="";

 const duration=
 Math.max(
  state.duration,
  30
 );

 const step=
 state.zoom>=100
 ?1
 :state.zoom>=60
 ?2
 :5;


 for(
  let t=0;
  t<=duration;
  t+=step
 ){

  const line=
  document.createElement("div");

  line.className="gridLine";

  line.style.left=
  xFromTime(t)+"px";

  grid.appendChild(line);

 }

}


/* =========================
   WAVEFORM
   ========================= */

function drawWave(){

 const width=
 Math.max(
  1,
  timelineWidth()
 );

 const canvasWidth=
 Math.min(
  width,
  16000
 );

 waveCanvas.width=
 canvasWidth;

 waveCanvas.height=70;

 waveCanvas.style.width=
 width+"px";

 const ctx=
 waveCanvas.getContext("2d");

 ctx.clearRect(
  0,0,
  canvasWidth,
  70
 );


 if(!audioBuffer)
  return;


 const data=
 audioBuffer.getChannelData(0);

 const step=
 data.length/canvasWidth;


 ctx.beginPath();

 for(
  let x=0;
  x<canvasWidth;
  x++
 ){

  const a=
  Math.floor(x*step);

  const b=
  Math.min(
   data.length,
   Math.floor((x+1)*step)
  );

  let min=1;

  let max=-1;

  for(
   let i=a;
   i<b;
   i++
  ){

   if(data[i]<min)
    min=data[i];

   if(data[i]>max)
    max=data[i];

  }

  ctx.moveTo(
   x,
   35+min*30
  );

  ctx.lineTo(
   x,
   35+max*30
  );

 }

 ctx.strokeStyle=
 "rgba(96,165,250,.65)";

 ctx.stroke();

}


/* =========================
   CONTINUE PART 3
   ========================= */
  /* =====================================================
   PART 3 — LYRIC TIMELINE + KEYFRAMES
   ===================================================== */


/* =========================
   RENDER
   ========================= */

function render(){

 updateTimelineSize();

 drawRuler();

 drawGrid();

 drawLyrics();

 updatePlayhead();

 updatePreview();

 updateKeyPanel();

 drawWave();

}


/* =========================
   DRAW LYRIC CLIPS
   ========================= */

function drawLyrics(){

 document
 .querySelectorAll(".clip")
 .forEach(
  el=>el.remove()
 );


 if(state.lines.length){

  empty.style.display="none";

 }else{

  empty.style.display="block";

 }


 state.lines.forEach(
 (line,index)=>{

  const clip=
  document.createElement("div");

  clip.className="clip";

  if(
   line.id===state.selectedLine
  ){

   clip.classList.add("selected");

  }


  clip.dataset.id=
  line.id;


  clip.style.left=
  xFromTime(line.start)+"px";


  clip.style.width=
  Math.max(
   45,
   xFromTime(
    line.end-line.start
   )
  )+"px";


  clip.style.top=
  (index*82+10)+"px";


  /* BODY */

  const body=
  document.createElement("div");

  body.className="clipBody";


  /* BASE TEXT */

  const text=
  document.createElement("div");

  text.className="clipText";

  text.textContent=
  line.text;


  /* HIGHLIGHT */

  const fill=
  document.createElement("div");

  fill.className="clipFill";


  const fillText=
  document.createElement("div");

  fillText.className="clipFillText";

  fillText.textContent=
  line.text;


  fill.appendChild(
   fillText
  );

  body.appendChild(
   text
  );

  body.appendChild(
   fill
  );

  clip.appendChild(
   body
  );


  /* LEFT HANDLE */

  const left=
  document.createElement("div");

  left.className=
  "handle leftHandle";

  clip.appendChild(left);


  /* RIGHT HANDLE */

  const right=
  document.createElement("div");

  right.className=
  "handle rightHandle";

  clip.appendChild(right);


  /* TIME */

  const info=
  document.createElement("div");

  info.className=
  "clipTime";

  info.textContent=
  fmt(line.start)
  +" → "
  +fmt(line.end);

  clip.appendChild(info);


  /* KEYFRAMES */

  line.keyframes
  .sort(
   (a,b)=>a.time-b.time
  )
  .forEach(
  key=>{

   const k=
   document.createElement("div");

   k.className="key";

   k.textContent="♦";

   if(
    key.id===state.selectedKey
   ){

    k.classList.add(
     "selected"
    );

   }


   const duration=
   line.end-line.start;

   let percent=0;

   if(duration>0){

    percent=
    (
     (key.time-line.start) /
     duration
    )*100;

   }


   k.style.left=
   percent+"%";


   k.onpointerdown=function(e){

    e.stopPropagation();

    state.selectedLine=
    line.id;

    state.selectedKey=
    key.id;

    state.currentTime=
    key.time;

    if(audio.src){

     audio.currentTime=
     key.time;

    }

    render();

   };


   clip.appendChild(k);

  });


  /* SELECT / MOVE */

  clip.onpointerdown=
  function(e){

   if(
    e.target.classList.contains(
     "key"
    )
   )
    return;

   if(
    e.target.classList.contains(
     "leftHandle"
    ) ||
    e.target.classList.contains(
     "rightHandle"
    )
   )
    return;


   state.selectedLine=
   line.id;

   state.selectedKey=null;

   moveClip(
    e,
    line,
    clip
   );

  };


  /* RESIZE */

  left.onpointerdown=
  function(e){

   e.stopPropagation();

   resizeClip(
    e,
    line,
    "left",
    clip
   );

  };


  right.onpointerdown=
  function(e){

   e.stopPropagation();

   resizeClip(
    e,
    line,
    "right",
    clip
   );

  };


  track.appendChild(clip);

 });

}


/* =========================
   MOVE CLIP
   ========================= */

function moveClip(
 event,
 line,
 clip
){

 const startX=
 event.clientX;

 const originalStart=
 line.start;

 const originalEnd=
 line.end;

 const deltaDuration=
 originalEnd-
 originalStart;


 const keyOriginal=
 line.keyframes.map(
  k=>({
   id:k.id,
   time:k.time
  })
 );


 clip.setPointerCapture(
  event.pointerId
 );


 function moving(e){

  const dx=
  e.clientX-startX;

  const dt=
  dx/state.zoom;


  let newStart=
  originalStart+dt;

  let newEnd=
  originalEnd+dt;


  if(newStart<0){

   newEnd-=newStart;

   newStart=0;

  }


  if(
   state.duration>0 &&
   newEnd>state.duration
  ){

   const excess=
   newEnd-state.duration;

   newStart-=excess;

   newEnd=
   state.duration;

  }


  newStart=
  Math.max(0,newStart);


  line.start=
  newStart;

  line.end=
  newEnd;


  const moveDelta=
  newStart-
  originalStart;


  line.keyframes.forEach(
   k=>{

    const old=
    keyOriginal.find(
     x=>x.id===k.id
    );

    if(old){

     k.time=
     old.time+
     moveDelta;

    }

   }
  );


  clip.style.left=
  xFromTime(newStart)+"px";

  clip.style.width=
  xFromTime(deltaDuration)+"px";

 }


 function done(){

  clip.removeEventListener(
   "pointermove",
   moving
  );

  clip.removeEventListener(
   "pointerup",
   done
  );

  clip.removeEventListener(
   "pointercancel",
   done
  );

  render();

 }


 clip.addEventListener(
  "pointermove",
  moving
 );

 clip.addEventListener(
  "pointerup",
  done
 );

 clip.addEventListener(
  "pointercancel",
  done
 );

}


/* =========================
   RESIZE CLIP
   ========================= */

function resizeClip(
 event,
 line,
 side,
 clip
){

 const startX=
 event.clientX;

 const oldStart=
 line.start;

 const oldEnd=
 line.end;


 clip.setPointerCapture(
  event.pointerId
 );


 function resizing(e){

  const dx=
  e.clientX-startX;

  const dt=
  dx/state.zoom;


  if(side==="left"){

   line.start=
   clamp(
    oldStart+dt,
    0,
    oldEnd-0.2
   );

  }else{

   line.end=
   clamp(
    oldEnd+dt,
    oldStart+0.2,
    state.duration
   );

  }


  line.keyframes.forEach(
   k=>{

    k.time=
    clamp(
     k.time,
     line.start,
     line.end
    );

   }
  );


  clip.style.left=
  xFromTime(line.start)+"px";

  clip.style.width=
  xFromTime(
   line.end-line.start
  )+"px";

 }


 function done(){

  clip.removeEventListener(
   "pointermove",
   resizing
  );

  clip.removeEventListener(
   "pointerup",
   done
  );

  clip.removeEventListener(
   "pointercancel",
   done
  );

  render();

 }


 clip.addEventListener(
  "pointermove",
  resizing
 );

 clip.addEventListener(
  "pointerup",
  done
 );

 clip.addEventListener(
  "pointercancel",
  done
 );

}


/* =========================
   PLAYHEAD
   ========================= */

function updatePlayhead(){

 playhead.style.left=
 xFromTime(
  state.currentTime
 )+"px";


 playhead.style.height=
 (
  ruler.offsetHeight+
  document.querySelector(".wave").offsetHeight+
  track.offsetHeight
 )+"px";

}


/* =========================
   ACTIVE LINE
   ========================= */

function activeLine(){

 return state.lines.find(
  line=>
   state.currentTime>=line.start &&
   state.currentTime<=line.end
 ) || null;

}


/* =========================
   INTERPOLATE KEYFRAMES
   ========================= */

function progressAt(
 line,
 t
){

 const keys=
 [...line.keyframes]
 .sort(
  (a,b)=>a.time-b.time
 );


 if(!keys.length)
  return 0;


 if(
  t<=keys[0].time
 )
  return keys[0].progress;


 const last=
 keys[keys.length-1];


 if(
  t>=last.time
 )
  return last.progress;


 for(
  let i=0;
  i<keys.length-1;
  i++
 ){

  const a=keys[i];

  const b=keys[i+1];


  if(
   t>=a.time &&
   t<=b.time
  ){

   const span=
   b.time-a.time;


   if(span<=0)
    return b.progress;


   const ratio=
   (t-a.time)/span;


   return a.progress+
   (
    b.progress-a.progress
   )*ratio;

  }

 }


 return 0;

}


/* =========================
   HIGHLIGHTS
   ========================= */

function updateHighlights(){

 state.lines.forEach(
 line=>{

  const clip=
  track.querySelector(
   '.clip[data-id="'+
   line.id+
   '"]'
  );

  if(!clip)
   return;


  const fill=
  clip.querySelector(
   ".clipFill"
  );

  if(!fill)
   return;


  if(
   state.currentTime<
   line.start ||
   state.currentTime>
   line.end
  ){

   fill.style.width="0%";

  }else{

   fill.style.width=
   clamp(
    progressAt(
     line,
     state.currentTime
    ),
    0,
    100
   )+"%";

  }

 });

}


/* =========================
   PREVIEW
   ========================= */

function updatePreview(){

 const line=
 activeLine();


 if(!line){

  previewBase.textContent="";

  previewHi.textContent="";

  previewHi.style.width="0%";

  return;

 }


 previewBase.textContent=
 line.text;

 previewHi.textContent=
 line.text;


 const p=
 progressAt(
  line,
  state.currentTime
 );


 previewHi.style.width=
 clamp(
  p,
  0,
  100
 )+"%";

}


/* =========================
   CONTINUE PART 4
   ========================= */
  /* =====================================================
   PART 4 — KEYFRAME CONTROLS + SAVE/LOAD + FINISH
   ===================================================== */


/* =========================
   KEY PANEL
   ========================= */

function updateKeyPanel(){

 const line=
 selectedLine();

 const key=
 selectedKey();


 if(!line){

  keyInfo.textContent=
  "No lyric selected";

  progress.disabled=true;

  sliderValue.textContent=
  "0%";

  progress.value=0;

  return;

 }


 if(!key){

  keyInfo.textContent=
  "Line selected";

  progress.disabled=true;

  sliderValue.textContent=
  "0%";

  progress.value=0;

  return;

 }


 progress.disabled=false;

 progress.value=
 key.progress;

 sliderValue.textContent=
 Math.round(
  key.progress
 )+"%";


 keyInfo.innerHTML=
 "KEY<br>"+
 fmt(key.time)+
 "<br>"+
 Math.round(key.progress)+
 "%";

}


/* =========================
   ADD KEYFRAME
   ========================= */

plusKey.onclick=function(){

 const line=
 selectedLine();


 if(!line){

  alert(
   "Select a lyric line first."
  );

  return;

 }


 const t=
 clamp(
  state.currentTime,
  line.start,
  line.end
 );


 /* Find existing keyframe */

 const existing=
 line.keyframes.find(
  k=>
   Math.abs(
    k.time-t
   )<0.05
 );


 if(existing){

  state.selectedKey=
  existing.id;

  render();

  return;

 }


 /* Automatically calculate
    progress from surrounding keys */

 const p=
 progressAt(
  line,
  t
 );


 const key={

  id:uid(),

  time:t,

  progress:p

 };


 line.keyframes.push(key);

 line.keyframes.sort(
  (a,b)=>a.time-b.time
 );


 state.selectedKey=
 key.id;


 render();

};


/* =========================
   DELETE KEYFRAME
   ========================= */

minusKey.onclick=function(){

 const line=
 selectedLine();


 if(!line){

  alert(
   "Select a lyric line first."
  );

  return;

 }


 if(
  line.keyframes.length<=1
 ){

  alert(
   "At least one keyframe must remain."
  );

  return;

 }


 let index=-1;


 if(state.selectedKey){

  index=
  line.keyframes.findIndex(
   k=>
    k.id===
    state.selectedKey
  );

 }


 /* If none selected,
    delete nearest */

 if(index<0){

  let nearest=Infinity;

  line.keyframes.forEach(
   (k,i)=>{

    const d=
    Math.abs(
     k.time-
     state.currentTime
    );

    if(d<nearest){

     nearest=d;

     index=i;

    }

   }
  );

 }


 if(index>=0){

  line.keyframes.splice(
   index,
   1
  );

 }


 line.keyframes.sort(
  (a,b)=>a.time-b.time
 );


 if(line.keyframes.length){

  const newIndex=
  clamp(
   index,
   0,
   line.keyframes.length-1
  );

  state.selectedKey=
  line.keyframes[
   newIndex
  ].id;

 }else{

  state.selectedKey=null;

 }


 render();

};


/* =========================
   SHADING SLIDER
   ========================= */

progress.oninput=function(){

 const key=
 selectedKey();


 if(!key)
  return;


 key.progress=
 Number(
  progress.value
 );


 sliderValue.textContent=
 Math.round(
  key.progress
 )+"%";


 updatePreview();

 updateHighlights();

};


/* =========================
   AUTO 0 → 100
   ========================= */

function autoKeys(){

 const line=
 selectedLine();


 if(!line){

  alert(
   "Select a lyric line first."
  );

  return;

 }


 line.keyframes=[

  {
   id:uid(),
   time:line.start,
   progress:0
  },

  {
   id:uid(),
   time:line.end,
   progress:100
  }

 ];


 state.selectedKey=
 line.keyframes[0].id;


 render();

}


autoBtn.onclick=
autoKeys;

resetBtn.onclick=
autoKeys;


/* =========================
   SPLIT
   ========================= */

splitBtn.onclick=function(){

 const line=
 selectedLine();


 if(!line){

  alert(
   "Select a lyric line first."
  );

  return;

 }


 const t=
 state.currentTime;


 if(
  t<=line.start+0.1 ||
  t>=line.end-0.1
 ){

  alert(
   "Put the playhead inside the lyric line."
  );

  return;

 }


 const words=
 line.text
 .split(/\s+/)
 .filter(Boolean);


 let leftText=
 line.text;

 let rightText=
 "";


 if(words.length>1){

  const mid=
  Math.ceil(
   words.length/2
  );

  leftText=
  words
  .slice(0,mid)
  .join(" ");

  rightText=
  words
  .slice(mid)
  .join(" ");

 }


 const left={

  id:uid(),

  text:leftText,

  start:line.start,

  end:t,

  keyframes:[

   {
    id:uid(),
    time:line.start,
    progress:0
   },

   {
    id:uid(),
    time:t,
    progress:100
   }

  ]

 };


 const right={

  id:uid(),

  text:rightText || line.text,

  start:t,

  end:line.end,

  keyframes:[

   {
    id:uid(),
    time:t,
    progress:0
   },

   {
    id:uid(),
    time:line.end,
    progress:100
   }

  ]

 };


 const index=
 state.lines.findIndex(
  x=>x.id===line.id
 );


 state.lines.splice(
  index,
  1,
  left,
  right
 );


 state.selectedLine=
 right.id;

 state.selectedKey=
 right.keyframes[0].id;


 render();

};


/* =========================
   DUPLICATE
   ========================= */

duplicateBtn.onclick=function(){

 const line=
 selectedLine();


 if(!line){

  alert(
   "Select a lyric line first."
  );

  return;

 }


 const duration=
 line.end-line.start;


 let start=
 line.end+0.2;


 let end=
 start+duration;


 if(end>state.duration){

  end=
  state.duration;

  start=
  Math.max(
   0,
   end-duration
  );

 }


 const copy={

  id:uid(),

  text:line.text,

  start:start,

  end:end,

  keyframes:
  line.keyframes.map(
   k=>({

    id:uid(),

    time:
    start+
    (
     k.time-
     line.start
    ),

    progress:
    k.progress

   })
  )

 };


 state.lines.push(copy);


 state.lines.sort(
  (a,b)=>
   a.start-b.start
 );


 state.selectedLine=
 copy.id;

 state.selectedKey=
 copy.keyframes[0]?.id ||
 null;


 render();

};


/* =========================
   DELETE LINE
   ========================= */

deleteBtn.onclick=function(){

 const line=
 selectedLine();


 if(!line){

  alert(
   "Select a lyric line first."
  );

  return;

 }


 if(
  !confirm(
   "Delete this lyric line?"
  )
 )
  return;


 state.lines=
 state.lines.filter(
  x=>x.id!==line.id
 );


 state.selectedLine=
 state.lines[0]?.id ||
 null;

 state.selectedKey=
 state.lines[0]
 ?.keyframes[0]
 ?.id ||
 null;


 render();

};


/* =========================
   SAVE LOCAL
   ========================= */

saveBtn.onclick=function(){

 try{

  localStorage.setItem(
   "karaoke_fx_project",
   JSON.stringify(state)
  );

  alert(
   "Project saved on this device."
  );

 }catch(e){

  alert(
   "Save failed."
  );

 }

};


/* =========================
   LOAD LOCAL
   ========================= */

loadBtn.onclick=function(){

 try{

  const saved=
  localStorage.getItem(
   "karaoke_fx_project"
  );


  if(!saved){

   alert(
    "No saved project."
   );

   return;

  }


  const data=
  JSON.parse(saved);


  state={

   audioName:
   data.audioName || "",

   duration:
   Number(
    data.duration || 0
   ),

   zoom:
   Number(
    data.zoom || 80
   ),

   currentTime:
   Number(
    data.currentTime || 0
   ),

   lines:
   Array.isArray(data.lines)
   ?data.lines
   :[],

   selectedLine:
   data.selectedLine ||
   null,

   selectedKey:
   data.selectedKey ||
   null

  };


  seek.max=
  state.duration;

  seek.value=
  state.currentTime;


  render();


  alert(
   "Project loaded.\n\nLoad the MP3 again if necessary."
  );


 }catch(e){

  console.error(e);

  alert(
   "Could not load project."
  );

 }

};


/* =========================
   EXPORT
   ========================= */

exportBtn.onclick=function(){

 const data=
 JSON.stringify(
  state,
  null,
  2
 );


 const blob=
 new Blob(
  [data],
  {
   type:
   "application/json"
  }
 );


 const url=
 URL.createObjectURL(blob);


 const a=
 document.createElement("a");

 a.href=url;

 a.download=
 "karaoke-project.json";

 document.body.appendChild(a);

 a.click();

 a.remove();

 URL.revokeObjectURL(url);

};


/* =========================
   IMPORT
   ========================= */

importBtn.onclick=function(){

 jsonInput.click();

};


jsonInput.onchange=
async function(e){

 const file=
 e.target.files[0];

 if(!file)
  return;


 try{

  const data=
  JSON.parse(
   await file.text()
  );


  state={

   audioName:
   data.audioName || "",

   duration:
   Number(
    data.duration || 0
   ),

   zoom:
   Number(
    data.zoom || 80
   ),

   currentTime:
   Number(
    data.currentTime || 0
   ),

   lines:
   Array.isArray(data.lines)
   ?data.lines
   :[],

   selectedLine:
   data.selectedLine ||
   null,

   selectedKey:
   data.selectedKey ||
   null

  };


  seek.max=
  state.duration;

  seek.value=
  state.currentTime;


  render();


  alert(
   "Project imported."
  );


 }catch(err){

  alert(
   "Invalid project file."
  );

 }


 jsonInput.value="";

};


/* =========================
   CLICK EMPTY TIMELINE
   ========================= */

timeline.onpointerdown=
function(e){

 if(
  e.target.closest(".clip")
 )
  return;


 const rect=
 timeline.getBoundingClientRect();


 const x=
 e.clientX-
 rect.left;


 const t=
 clamp(
  timeFromX(x),
  0,
  state.duration
 );


 state.currentTime=t;


 if(audio.src){

  audio.currentTime=t;

 }


 updatePlayhead();

 updatePreview();

};


/* =========================
   KEYBOARD
   ========================= */

document.onkeydown=
function(e){

 const tag=
 document.activeElement?.tagName;


 if(
  tag==="INPUT" ||
  tag==="TEXTAREA"
 )
  return;


 if(e.code==="Space"){

  e.preventDefault();

  playBtn.click();

 }


 if(e.key==="+")
  plusKey.click();


 if(e.key==="-")
  minusKey.click();


 if(e.key==="Delete"){

  if(selectedKey()){

   minusKey.click();

  }else{

   deleteBtn.click();

  }

 }

};


/* =========================
   AUTO SCROLL
   ========================= */

function followPlayhead(){

 const x=
 xFromTime(
  state.currentTime
 );


 const left=
 scroll.scrollLeft;

 const right=
 left+
 scroll.clientWidth;


 if(x<left+40){

  scroll.scrollLeft=
  Math.max(
   0,
   x-100
  );

 }


 if(x>right-40){

  scroll.scrollLeft=
  x-
  scroll.clientWidth+
  100;

 }

}


/* =========================
   ANIMATION
   ========================= */

function loop(){

 if(!audio.paused){

  state.currentTime=
  audio.currentTime;

  updatePlayhead();

  updatePreview();

  updateHighlights();

  followPlayhead();

 }


 requestAnimationFrame(loop);

}


/* =========================
   RESIZE
   ========================= */

window.onresize=
function(){

 render();

};


/* =========================
   START
   ========================= */

render();

loop();

</script>
