<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Easy CapCut Karaoke Editor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background-color: #0b0f19; color: #f8fafc; touch-action: manipulation; }
    .custom-scrollbar::-webkit-scrollbar { height: 6px; width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #38bdf8; border-radius: 4px; }

    .timeline-block {
      position: absolute;
      height: 52px;
      background: linear-gradient(90deg, #1e3a8a, #0284c7);
      border: 2px solid #38bdf8;
      border-radius: 8px;
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
      user-select: none;
      touch-action: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .timeline-block.selected {
      border-color: #f43f5e;
      background: linear-gradient(90deg, #881337, #e11d48);
      box-shadow: 0 0 15px rgba(244, 63, 94, 0.8);
      z-index: 20;
    }

    .drag-handle {
      width: 26px;
      height: 100%;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: ew-resize;
      touch-action: none;
      shrink: 0;
      z-index: 10;
    }
    
    .drag-handle-left { border-radius: 6px 0 0 6px; border-right: 2px solid #0284c7; }
    .drag-handle-right { border-radius: 0 6px 6px 0; border-left: 2px solid #0284c7; }

    .drag-handle::after {
      content: "||";
      font-size: 11px;
      color: #0f172a;
      font-weight: 900;
    }

    .lyric-preview {
      font-size: 1.8rem;
      font-weight: 900;
      color: #475569;
      transition: all 0.15s ease;
      text-align: center;
    }
    .lyric-preview.active {
      color: #38bdf8;
      transform: scale(1.1);
      text-shadow: 0 0 20px rgba(56, 189, 248, 0.9);
    }
  </style>
</head>
<body class="h-screen flex flex-col overflow-hidden select-none">
  <!-- TOP HEADER -->
  <header class="bg-slate-900 border-b border-slate-800 px-4 py-2 flex items-center justify-between shrink-0">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 bg-sky-500 rounded-lg flex items-center justify-center text-slate-950 font-black">
        <i class="fa-solid fa-scissors"></i>
      </div>
      <h1 class="text-xs font-bold uppercase tracking-wider text-sky-400">CapCut Lyric Editor</h1>
    </div>

    <div class="flex items-center gap-2">
      <label class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-sky-400 border border-sky-500/30 rounded-lg text-xs font-bold cursor-pointer">
        <i class="fa-solid fa-music"></i> MP3
        <input type="file" id="audio-input" accept="audio/*" class="hidden" onchange="loadAudio(event)">
      </label>
      <button onclick="addLyricBlock()" class="px-3 py-1.5 bg-sky-600 active:scale-95 text-white rounded-lg text-xs font-bold shadow-md">
        + Line
      </button>
    </div>
  </header>

  <!-- KARAOKE PREVIEW DISPLAY -->
  <div class="flex-1 bg-slate-950 flex flex-col items-center justify-center p-4 relative">
    <div id="preview-text" class="lyric-preview max-w-xl">
      [I-tap ang lyrics sa ibaba para ma-edit]
    </div>

    <div class="absolute top-3 left-4 text-xs font-mono text-slate-500">
      Time: <span id="time-display" class="text-sky-400 font-bold">00:00.00</span>
    </div>
  </div>

  <!-- SELECTED BLOCK FINE-TUNE DRAWER -->
  <div id="edit-panel" class="bg-slate-900 border-t border-slate-800 p-2 text-xs flex flex-col gap-2 shrink-0">
    <div class="flex items-center justify-between gap-2">
      <input type="text" id="edit-text-input" oninput="updateSelectedText(this.value)" class="flex-1 bg-slate-950 border border-slate-700 rounded px-2 py-1 text-slate-200 font-bold focus:border-sky-500 focus:outline-none" placeholder="Selected Lyric Text...">
      <button onclick="deleteSelected()" class="px-3 py-1 bg-rose-950 border border-rose-600/50 text-rose-400 rounded font-bold"><i class="fa-solid fa-trash"></i></button>
    </div>

    <div class="flex items-center justify-between text-[11px]">
      <!-- START TIME NUDGE -->
      <div class="flex items-center gap-1">
        <span class="text-slate-400">Start:</span>
        <button onclick="adjustTime('start', -0.2)" class="px-2 py-1 bg-slate-800 text-sky-400 rounded font-bold">-0.2s</button>
        <span id="label-start-time" class="font-mono text-sky-400 font-bold">0.0s</span>
        <button onclick="adjustTime('start', 0.2)" class="px-2 py-1 bg-slate-800 text-sky-400 rounded font-bold">+0.2s</button>
      </div>

      <!-- DURATION / END TIME NUDGE -->
      <div class="flex items-center gap-1">
        <span class="text-slate-400">Duration:</span>
        <button onclick="adjustTime('duration', -0.2)" class="px-2 py-1 bg-slate-800 text-emerald-400 rounded font-bold">-0.2s</button>
        <span id="label-duration" class="font-mono text-emerald-400 font-bold">0.0s</span>
        <button onclick="adjustTime('duration', 0.2)" class="px-2 py-1 bg-slate-800 text-emerald-400 rounded font-bold">+0.2s</button>
      </div>
    </div>
  </div>

  <!-- AUDIO PLAYBAR -->
  <div class="bg-slate-900 border-t border-slate-800 p-2 flex items-center justify-between px-4 shrink-0">
    <button id="btn-play" onclick="togglePlay()" class="w-8 h-8 bg-sky-500 text-slate-950 rounded-full flex items-center justify-center font-bold text-sm shrink-0 active:scale-95">
      <i class="fa-solid fa-play" id="play-icon"></i>
    </button>
    <div class="flex-1 mx-4">
      <input type="range" id="audio-seekbar" value="0" min="0" max="100" class="w-full accent-sky-400 h-2 bg-slate-800 rounded-lg cursor-pointer" oninput="seekAudio(event)">
    </div>
  </div>

  <!-- CAPCUT TIMELINE TRACK EDITOR -->
  <div class="h-56 bg-slate-900 border-t border-slate-800 flex flex-col shrink-0">
    <div class="px-3 py-1 bg-slate-950 border-b border-slate-800 flex justify-between items-center text-[11px] text-slate-400">
      <span><i class="fa-solid fa-layer-group"></i> TIMELINE TRACKS</span>
      <span>Zoom: <input type="range" min="15" max="80" value="35" id="zoom-scale" oninput="renderTimeline()" class="accent-sky-400 w-24"></span>
    </div>

    <!-- DRAGGABLE TIMELINE CONTAINER -->
    <div id="timeline-container" class="flex-1 overflow-x-auto custom-scrollbar relative p-2 bg-slate-950">
      <!-- PLAYHEAD LINE -->
      <div id="playhead" class="absolute top-0 bottom-0 w-0.5 bg-rose-500 z-30 pointer-events-none"></div>

      <!-- TRACKS AREA -->
      <div id="timeline-tracks" class="relative min-w-[3000px] h-full"></div>
    </div>
  </div>

  <audio id="audio-player"></audio>
  <script>
    let tracksData = [
      { id: 1, text: "Ako'y nananabik", start: 1.0, end: 4.5 },
      { id: 2, text: "Sa 'yong pagbabalik", start: 5.0, end: 8.5 },
      { id: 3, text: "Lahat ng luha ay mapapawi", start: 9.0, end: 13.0 }
    ];

    let pps = 35; // Pixels Per Second
    let activeBlockId = 1;
    let dragMode = null; // 'move', 'resize-left', 'resize-right'
    let startX = 0;
    let origStart = 0;
    let origEnd = 0;

    const audio = document.getElementById('audio-player');

    window.onload = () => {
      renderTimeline();
      setupAudioListeners();
      setupGlobalTouchEvents();
      updateEditPanelUI();
    };

    function loadAudio(e) {
      const file = e.target.files[0];
      if (file) {
        audio.src = URL.createObjectURL(file);
        audio.load();
      }
    }

    function togglePlay() {
      if (!audio.src) return alert("Pumili muna ng MP3 file!");
      if (audio.paused) {
        audio.play();
        document.getElementById('play-icon').className = "fa-solid fa-pause";
      } else {
        audio.pause();
        document.getElementById('play-icon').className = "fa-solid fa-play";
      }
    }

    function seekAudio(e) {
      if (!audio.duration) return;
      audio.currentTime = (e.target.value / 100) * audio.duration;
    }

    function setupAudioListeners() {
      audio.ontimeupdate = () => {
        if (!audio.duration) return;
        const cur = audio.currentTime;

        document.getElementById('audio-seekbar').value = (cur / audio.duration) * 100;
        const m = Math.floor(cur / 60);
        const s = (cur % 60).toFixed(2);
        document.getElementById('time-display').innerText = `${m < 10 ? '0':''}${m}:${s < 10 ? '0':''}${s}`;

        document.getElementById('playhead').style.left = `${cur * pps}px`;

        const activeBlock = tracksData.find(b => cur >= b.start && cur <= b.end);
        const preview = document.getElementById('preview-text');
        if (activeBlock) {
          preview.innerText = activeBlock.text;
          preview.className = "lyric-preview active";
        } else {
          preview.className = "lyric-preview";
        }
      };
    }

    function renderTimeline() {
      pps = parseInt(document.getElementById('zoom-scale').value);
      const container = document.getElementById('timeline-tracks');
      container.innerHTML = '';

      tracksData.forEach((item, index) => {
        const block = document.createElement('div');
        block.className = `timeline-block ${activeBlockId === item.id ? 'selected' : ''}`;
        block.style.left = `${item.start * pps}px`;
        block.style.width = `${Math.max((item.end - item.start) * pps, 60)}px`;
        block.style.top = `${index * 56}px`;

        const leftHandle = document.createElement('div');
        leftHandle.className = 'drag-handle drag-handle-left';
        leftHandle.addEventListener('touchstart', (e) => startDrag(e, item.id, 'resize-left'), { passive: false });
        leftHandle.addEventListener('mousedown', (e) => startDrag(e, item.id, 'resize-left'));

        const textSpan = document.createElement('span');
        textSpan.className = 'truncate px-2 flex-1 text-center cursor-pointer';
        textSpan.innerText = item.text;
        
        textSpan.onclick = () => {
          activeBlockId = item.id;
          renderTimeline();
          updateEditPanelUI();
        };

        const rightHandle = document.createElement('div');
        rightHandle.className = 'drag-handle drag-handle-right';
        rightHandle.addEventListener('touchstart', (e) => startDrag(e, item.id, 'resize-right'), { passive: false });
        rightHandle.addEventListener('mousedown', (e) => startDrag(e, item.id, 'resize-right'));

        block.addEventListener('touchstart', (e) => {
          if (!e.target.classList.contains('drag-handle')) startDrag(e, item.id, 'move');
        }, { passive: false });
        block.addEventListener('mousedown', (e) => {
          if (!e.target.classList.contains('drag-handle')) startDrag(e, item.id, 'move');
        });

        block.appendChild(leftHandle);
        block.appendChild(textSpan);
        block.appendChild(rightHandle);

        container.appendChild(block);
      });
    }

    function startDrag(e, id, mode) {
      e.stopPropagation();
      if (e.cancelable) e.preventDefault();

      activeBlockId = id;
      dragMode = mode;
      
      const target = tracksData.find(t => t.id === id);
      origStart = target.start;
      origEnd = target.end;

      const pageX = e.touches ? e.touches[0].pageX : e.pageX;
      startX = pageX;

      renderTimeline();
      updateEditPanelUI();
    }

    function setupGlobalTouchEvents() {
      const handleMove = (e) => {
        if (!dragMode || !activeBlockId) return;

        const pageX = e.touches ? e.touches[0].pageX : e.pageX;
        const deltaX = pageX - startX;
        const deltaTime = deltaX / pps;

        const target = tracksData.find(t => t.id === activeBlockId);

        if (dragMode === 'move') {
          const duration = origEnd - origStart;
          target.start = Math.max(0, origStart + deltaTime);
          target.end = target.start + duration;
        } else if (dragMode === 'resize-left') {
          target.start = Math.max(0, Math.min(origEnd - 0.4, origStart + deltaTime));
        } else if (dragMode === 'resize-right') {
          target.end = Math.max(target.start + 0.4, origEnd + deltaTime);
        }

        renderTimeline();
        updateEditPanelUI();
      };

      const handleEnd = () => { dragMode = null; };

      window.addEventListener('touchmove', handleMove, { passive: false });
      window.addEventListener('mousemove', handleMove);
      window.addEventListener('touchend', handleEnd);
      window.addEventListener('mouseup', handleEnd);
    }

    function updateEditPanelUI() {
      const target = tracksData.find(t => t.id === activeBlockId);
      if (target) {
        document.getElementById('edit-text-input').value = target.text;
        document.getElementById('label-start-time').innerText = `${target.start.toFixed(1)}s`;
        document.getElementById('label-duration').innerText = `${(target.end - target.start).toFixed(1)}s`;
      }
    }

    function updateSelectedText(val) {
      const target = tracksData.find(t => t.id === activeBlockId);
      if (target) {
        target.text = val;
        renderTimeline();
      }
    }

    function adjustTime(type, delta) {
      const target = tracksData.find(t => t.id === activeBlockId);
      if (!target) return;

      if (type === 'start') {
        const duration = target.end - target.start;
        target.start = Math.max(0, target.start + delta);
        target.end = target.start + duration;
      } else if (type === 'duration') {
        target.end = Math.max(target.start + 0.4, target.end + delta);
      }

      renderTimeline();
      updateEditPanelUI();
    }

    function addLyricBlock() {
      const text = prompt("I-enter ang Bagong Linya ng Lyrics:", "Bagong Lyrics Line");
      if (text) {
        const lastEnd = tracksData.length > 0 ? tracksData[tracksData.length - 1].end : 0;
        const newBlock = {
          id: Date.now(),
          text: text,
          start: lastEnd + 0.5,
          end: lastEnd + 4.5
        };
        tracksData.push(newBlock);
        activeBlockId = newBlock.id;
        renderTimeline();
        updateEditPanelUI();
      }
    }

    function deleteSelected() {
      if (!activeBlockId) return alert("Pumili muna ng lyrics block!");
      tracksData = tracksData.filter(t => t.id !== activeBlockId);
      activeBlockId = tracksData.length > 0 ? tracksData[0].id : null;
      renderTimeline();
      updateEditPanelUI();
    }
  </script>
</body>
</html>
